services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sloppy
      POSTGRES_PASSWORD: sloppy_dev
      POSTGRES_DB: sloppy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sloppy"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      CORS_ORIGIN: http://localhost:8080
      AUTH_SERVICE_URL: http://auth:3002
      GAME_BUILDER_URL: http://game-builder:3003
      AI_ORCHESTRATOR_URL: http://ai-orchestrator:3004
      MULTIPLAYER_URL: http://multiplayer:3005
      PAYMENTS_URL: http://payments:3006
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_GENERAL_AUTH_RPM: "100"
      RATE_LIMIT_GENERAL_UNAUTH_RPM: "30"
      RATE_LIMIT_GENERATION_PER_HOUR: "5"
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/firebase-sa.json
      LOG_LEVEL: debug
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      redis:
        condition: service_healthy

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    ports:
      - "3002:3002"
    environment:
      PORT: "3002"
      DATABASE_URL: postgresql://sloppy:sloppy_dev@postgres:5432/sloppy
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/firebase-sa.json
      LOG_LEVEL: debug
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

  game-builder:
    build:
      context: .
      dockerfile: services/game-builder/Dockerfile
    ports:
      - "3003:3003"
    environment:
      PORT: "3003"
      DATABASE_URL: postgresql://sloppy:sloppy_dev@postgres:5432/sloppy
      REDIS_URL: redis://redis:6379
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/firebase-sa.json
      GCS_BUCKET: ${GCS_BUCKET:-sloppy-game-bundles-dev}
      CDN_BASE_URL: ${CDN_BASE_URL:-https://storage.googleapis.com/sloppy-game-bundles-dev}
      MAX_BUNDLE_SIZE_BYTES: "5242880"
      PLAY_DEBOUNCE_WINDOW_SECONDS: "300"
      LOG_LEVEL: debug
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-orchestrator:
    build:
      context: .
      dockerfile: services/ai-orchestrator/Dockerfile
    ports:
      - "3004:3004"
    environment:
      PORT: "3004"
      DATABASE_URL: postgresql://sloppy:sloppy_dev@postgres:5432/sloppy
      REDIS_URL: redis://redis:6379
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      GROK_API_KEY: ${GROK_API_KEY}
      GROK_MODEL: ${GROK_MODEL:-grok-3}
      GENERATION_TIMEOUT_MS: "120000"
      MAX_TOKENS_CONCEPT: "2000"
      MAX_TOKENS_CODE: "8000"
      MAX_TOKENS_ASSETS: "2000"
      MAX_TOKENS_MULTIPLAYER: "4000"
      DAILY_COST_THRESHOLD: "50"
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  multiplayer:
    build:
      context: .
      dockerfile: services/multiplayer/Dockerfile
    ports:
      - "3005:3005"
    environment:
      PORT: "3005"
      DATABASE_URL: postgresql://sloppy:sloppy_dev@postgres:5432/sloppy
      REDIS_URL: redis://redis:6379
      REDIS_KEY_TTL: "3600"
      MAX_CONCURRENT_SESSIONS: "100"
      MAX_PLAYERS_PER_SESSION: "4"
      TICK_RATE: "20"
      WS_HEARTBEAT_INTERVAL: "30000"
      WS_HEARTBEAT_TIMEOUT: "10000"
      CLEANUP_INTERVAL: "300000"
      EMPTY_ROOM_TIMEOUT: "60000"
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/firebase-sa.json
      LOG_LEVEL: debug
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  payments:
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    ports:
      - "3006:3006"
    environment:
      PORT: "3006"
      DATABASE_URL: postgresql://sloppy:sloppy_dev@postgres:5432/sloppy
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID}
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3001
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_CDN_URL: ${VITE_CDN_URL}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
    ports:
      - "8080:8080"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  redis_data:
