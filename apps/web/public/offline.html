<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sloppy — Offline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #fdf6ec;
      color: #2d2d2d;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 480px;
    }
    .emoji {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      animation: wiggle 2s ease-in-out infinite;
    }
    h1 {
      font-family: 'Patrick Hand', cursive;
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #ff6eb4;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #2d2d2d;
      opacity: 0.8;
    }
    .retry-btn {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.75rem 2rem;
      background: #ff6eb4;
      color: white;
      border: none;
      border-radius: 1.2rem;
      font-family: 'Patrick Hand', cursive;
      font-size: 1.25rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .retry-btn:hover {
      transform: scale(1.05) rotate(-1deg);
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">📡</div>
    <h1>You're offline!</h1>
    <p>Come back when you have internet to generate more sloppy games.</p>
    <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
