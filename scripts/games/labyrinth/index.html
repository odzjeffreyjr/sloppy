// ── AudioManager ──
function createAudioManager(opts) {

  function ev(base) { return muted ? 0 : base * masterVol; }

  var mgr = {
    play: function(key) {
      if (muted || paused) return;
      notifyParent();
      if (useHowler && spriteHowl) { spriteHowl.volume(ev(sfxVol)); spriteHowl.play(key); return; }
      var p = typeof SFX !== 'undefined' && SFX[key];
      if (p) { var a = [].concat(p); a[0] = (a[0] || 1) * ev(sfxVol); zzfx.apply(null, a); }
    },
    playAmbient: function(src, loop) {
      if (typeof Howl !== 'function') return;
      mgr.stopAmbient();
      notifyParent();
      ambientHowl = new Howl({ src: [src], loop: loop !== false, volume: ev(musicVol) });
      if (!paused) ambientHowl.play();
    },
    stopAmbient: function() { if (ambientHowl) { ambientHowl.stop(); ambientHowl.unload(); ambientHowl = null; } },
    setMasterVolume: function(v) { masterVol = Math.max(0, Math.min(1, v)); },
    setMusicVolume: function(v) { musicVol = Math.max(0, Math.min(1, v)); },
    setSFXVolume: function(v) { sfxVol = Math.max(0, Math.min(1, v)); },
    onPause: function() { paused = true; if (spriteHowl) spriteHowl.pause(); if (ambientHowl) ambientHowl.pause(); },
    onResume: function() { paused = false; if (ambientHowl && !muted) ambientHowl.play(); },
    onDestroy: function() { if (spriteHowl) { spriteHowl.unload(); spriteHowl = null; } mgr.stopAmbient(); window.removeEventListener('message', onMsg); },
    mute: function() { muted = true; if (typeof Howler !== 'undefined') Howler.mute(true); },

// ── Utilities ──
function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

// ── Maze generation (iterative recursive backtracking) ──
function generateMaze(N) {
  var gs = 2 * N + 1;
  var grid = [];
  for (var r = 0; r < gs; r++) { grid[r] = new Uint8Array(gs); }
  var stack = [[1, 1]];
  grid[1][1] = 1;
  while (stack.length > 0) {
    var cur = stack[stack.length - 1];
    var cr = cur[0], cc = cur[1];
    var neighbors = [];
    var dirs = [[-2,0],[2,0],[0,-2],[0,2]];
    for (var di = 0; di < 4; di++) {
      var nr = cr + dirs[di][0], nc = cc + dirs[di][1];
      if (nr > 0 && nr < gs && nc > 0 && nc < gs && grid[nr][nc] === 0) {
        neighbors.push([nr, nc, cr + dirs[di][0]/2, cc + dirs[di][1]/2]);
      }
    }
    if (neighbors.length === 0) { stack.pop(); }
    else {
      var pick = neighbors[Math.floor(Math.random() * neighbors.length)];
      grid[pick[2]][pick[3]] = 1;
      grid[pick[0]][pick[1]] = 1;
      stack.push([pick[0], pick[1]]);
    }
  }
  return grid;
}

// ── BFS pathfinding ──
function bfs(grid, sr, sc, er, ec) {
  var gs = grid.length;
  if (sr === er && sc === ec) return [[sr, sc]];
  var queue = [[sr, sc]], visited = {}, head = 0;
  visited[sr + ',' + sc] = null;
  while (head < queue.length) {
    var c = queue[head++], r0 = c[0], c0 = c[1];
    var dd = [[-1,0],[1,0],[0,-1],[0,1]];
    for (var i = 0; i < 4; i++) {
      var nr = r0 + dd[i][0], nc = c0 + dd[i][1], key = nr + ',' + nc;
      if (nr >= 0 && nr < gs && nc >= 0 && nc < gs && grid[nr][nc] === 1 && !(key in visited)) {
        visited[key] = r0 + ',' + c0;
        if (nr === er && nc === ec) {
          var path = [[nr, nc]], cur2 = r0 + ',' + c0;
          while (cur2 !== null) {
            var parts = cur2.split(',');
            path.unshift([parseInt(parts[0]), parseInt(parts[1])]);
            cur2 = visited[cur2];
          }
          return path;
        }
        queue.push([nr, nc]);
      }
    }
  }
  return null;
}

function bfsDistances(grid, sr, sc) {
  var gs = grid.length, dist = {}, queue = [[sr, sc]], head = 0;
  dist[sr + ',' + sc] = 0;
  while (head < queue.length) {
    var c = queue[head++], r0 = c[0], c0 = c[1], d = dist[r0 + ',' + c0];
    var dd = [[-1,0],[1,0],[0,-1],[0,1]];
    for (var i = 0; i < 4; i++) {
      var nr = r0 + dd[i][0], nc = c0 + dd[i][1], key = nr + ',' + nc;
      if (nr >= 0 && nr < gs && nc >= 0 && nc < gs && grid[nr][nc] === 1 && !(key in dist)) {
        dist[key] = d + 1;
        queue.push([nr, nc]);
      }
    }
  }
  return dist;
}

function findDeadEnds(grid) {
  var gs = grid.length, ends = [];
  for (var r = 1; r < gs - 1; r += 2) {
    for (var c = 1; c < gs - 1; c += 2) {
      if (grid[r][c] !== 1) continue;
      var open = 0;
      if (grid[r-1][c] === 1) open++;
      if (grid[r+1][c] === 1) open++;
      if (grid[r][c-1] === 1) open++;
      if (grid[r][c+1] === 1) open++;
      if (open === 1) ends.push([r, c]);
    }
  }
  return ends;
}

// ── Collision detection ──
function collidesWithWall(x, z, radius) {
  var gr0 = Math.round(z), gc0 = Math.round(x);
  for (var dr = -1; dr <= 1; dr++) {
    for (var dc = -1; dc <= 1; dc++) {
      var gr = gr0 + dr, gc = gc0 + dc;
      var isWall = (gr < 0 || gr >= gridSize || gc < 0 || gc >= gridSize) ? true : (mazeGrid[gr][gc] === 0);
      if (isWall) {
        var cx = Math.max(gc - 0.5, Math.min(x, gc + 0.5));
        var cz = Math.max(gr - 0.5, Math.min(z, gr + 0.5));
        var dx = x - cx, dz = z - cz;
        if (dx * dx + dz * dz < radius * radius) return true;
      }
    }
  }
  return false;
}

// ── Start game ──
function startGame() {
  score = 0; lives = 3; level = 1; keysCollected = 0; totalKeysCollected = 0; timeElapsed = 0;
  setupLevel(1);
  gameState = 'playing';
  introEl.style.display = 'none';
  hudEl.style.display = 'block';

// ── Setup level ──
var _setupRetries = 0;
function setupLevel(lvl) {
  clearLevel();
  var config = getLevelConfig(lvl);
  level = lvl; timer = config.timer; keysCollected = 0; keysTotal = config.numKeys;
  invincibleTimer = 0; shakeTimer = 0; yaw = 0; lastTickSec = -1; shadowNearCD = 0;

  mazeGrid = generateMaze(config.mazeSize);
  gridSize = mazeGrid.length;
  explored = [];
  for (var ei = 0; ei < gridSize; ei++) explored[ei] = new Uint8Array(gridSize);

  var spawnR = 1, spawnC = 1;
  exitGridR = gridSize - 2; exitGridC = gridSize - 2;
  mazeGrid[exitGridR][exitGridC] = 1;

  var pathToExit = bfs(mazeGrid, spawnR, spawnC, exitGridR, exitGridC);
  if (!pathToExit) { if (++_setupRetries < 20) { setupLevel(lvl); return; } else { _setupRetries = 0; } }

  var distMap = bfsDistances(mazeGrid, spawnR, spawnC);
  var deadEnds = findDeadEnds(mazeGrid);
  deadEnds.sort(function(a, b) { return (distMap[b[0]+','+b[1]] || 0) - (distMap[a[0]+','+a[1]] || 0); });
  var validDE = deadEnds.filter(function(de) { return !(de[0] === exitGridR && de[1] === exitGridC) && !(de[0] === spawnR && de[1] === spawnC); });

  var keyPositions = validDE.slice(0, config.numKeys);
  if (keyPositions.length < config.numKeys) {
    var allCells = [];
    for (var ar = 1; ar < gridSize - 1; ar += 2) for (var ac = 1; ac < gridSize - 1; ac += 2) {
      if (mazeGrid[ar][ac] === 1 && !(ar === 1 && ac === 1) && !(ar === exitGridR && ac === exitGridC))
        allCells.push([ar, ac, distMap[ar+','+ac] || 0]);
    }
    allCells.sort(function(a, b) { return b[2] - a[2]; });
    keyPositions = allCells.slice(0, config.numKeys).map(function(c) { return [c[0], c[1]]; });
  }

  for (var ki = 0; ki < keyPositions.length; ki++) {
    if (!bfs(mazeGrid, spawnR, spawnC, keyPositions[ki][0], keyPositions[ki][1])) { if (++_setupRetries < 20) { setupLevel(lvl); return; } else { _setupRetries = 0; } }
  }
  _setupRetries = 0;

  var longestPath = pathToExit.length;
  for (var kp = 0; kp < keyPositions.length; kp++) {
    var p1 = bfs(mazeGrid, spawnR, spawnC, keyPositions[kp][0], keyPositions[kp][1]);
    var p2 = bfs(mazeGrid, keyPositions[kp][0], keyPositions[kp][1], exitGridR, exitGridC);
    if (p1 && p2) longestPath = Math.max(longestPath, p1.length + p2.length);
  }
  var minTime = longestPath * 0.4 + 15;
  if (minTime > timer) timer = Math.ceil(minTime + 10);

  playerX = spawnC; playerZ = spawnR;
  checkpoint = { x: spawnC, z: spawnR };
  camera.position.set(playerX, PLAYER_HEIGHT, playerZ);
  camera.rotation.set(0, 0, 0);

  if (mazeGrid[spawnR][spawnC + 1] === 1) yaw = -Math.PI / 2;
  else if (mazeGrid[spawnR + 1] && mazeGrid[spawnR + 1][spawnC] === 1) yaw = Math.PI;

  var dummy = new THREE.Object3D(), idx = 0;

  // Floor with tiled look via InstancedMesh for passages
  var floorBaseGeo = new THREE.PlaneGeometry(gridSize + 2, gridSize + 2);
  var floorBaseMat = new THREE.MeshStandardMaterial({ color: 0x6a6050, roughness: 0.95 });
  floorMesh = new THREE.Mesh(floorBaseGeo, floorBaseMat);
  floorMesh.rotation.x = -Math.PI / 2;
  floorMesh.position.set((gridSize - 1) / 2, -0.01, (gridSize - 1) / 2);
  floorMesh.receiveShadow = true;
  scene.add(floorMesh);

  var passageCount = 0;
  for (var fr = 0; fr < gridSize; fr++) for (var fc = 0; fc < gridSize; fc++) if (mazeGrid[fr][fc] === 1) passageCount++;
  var tileGeo = new THREE.BoxGeometry(0.94, 0.06, 0.94);
  sharedGeos.push(tileGeo);
  var tileMat2 = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7, metalness: 0.02 });
  tileMesh = new THREE.InstancedMesh(tileGeo, tileMat2, passageCount);
  tileMesh.receiveShadow = true;
  var tileColor = new THREE.Color();
  var baseTile1 = new THREE.Color(0xd8ccb4);
  var baseTile2 = new THREE.Color(0xc4b89c);
  var tIdx = 0;
  for (var fr2 = 0; fr2 < gridSize; fr2++) for (var fc2 = 0; fc2 < gridSize; fc2++) {
    if (mazeGrid[fr2][fc2] === 1) {
      dummy.position.set(fc2, 0.03, fr2);
      dummy.updateMatrix();
      tileMesh.setMatrixAt(tIdx, dummy.matrix);
      var checker = (fr2 + fc2) % 2 === 0;
      var tBase = checker ? baseTile1 : baseTile2;
      var tv = 0.92 + Math.random() * 0.16;
      tileColor.setRGB(tBase.r * tv, tBase.g * tv, tBase.b * tv);
      tileMesh.setColorAt(tIdx, tileColor);
      tIdx++;
    }
  }
  tileMesh.instanceMatrix.needsUpdate = true;
  tileMesh.instanceColor.needsUpdate = true;
  scene.add(tileMesh);

  // Walls (InstancedMesh with per-instance color variation + gaps for definition)
  var wallCount = 0;
  for (var wr = 0; wr < gridSize; wr++) for (var wc = 0; wc < gridSize; wc++) if (mazeGrid[wr][wc] === 0) wallCount++;
  var wallGeo = new THREE.BoxGeometry(0.96, WALL_HEIGHT, 0.96);
  var wallMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.75, metalness: 0.05 });
  wallMesh = new THREE.InstancedMesh(wallGeo, wallMat, wallCount);
  wallMesh.castShadow = true; wallMesh.receiveShadow = true;
  idx = 0;
  var baseWallColor = new THREE.Color(0xb8a88a);
  var instanceColor = new THREE.Color();
  for (var wr2 = 0; wr2 < gridSize; wr2++) for (var wc2 = 0; wc2 < gridSize; wc2++) {
    if (mazeGrid[wr2][wc2] === 0) {
      dummy.position.set(wc2, WALL_HEIGHT / 2, wr2);
      dummy.updateMatrix();
      wallMesh.setMatrixAt(idx, dummy.matrix);
      var v = 0.82 + Math.random() * 0.36;
      instanceColor.setRGB(baseWallColor.r * v, baseWallColor.g * v, baseWallColor.b * v);
      wallMesh.setColorAt(idx, instanceColor);
      idx++;
    }
  }
  wallMesh.instanceMatrix.needsUpdate = true;
  wallMesh.instanceColor.needsUpdate = true;
  scene.add(wallMesh);

  // Wall top trim (darker caps for definition)
  var capGeo = new THREE.BoxGeometry(0.98, 0.06, 0.98);
  sharedGeos.push(capGeo);
  var capMat = new THREE.MeshStandardMaterial({ color: 0x8a7a6a, roughness: 0.9 });
  capMesh = new THREE.InstancedMesh(capGeo, capMat, wallCount);
  capMesh.receiveShadow = true;
  idx = 0;
  for (var wr3 = 0; wr3 < gridSize; wr3++) for (var wc3 = 0; wc3 < gridSize; wc3++) {
    if (mazeGrid[wr3][wc3] === 0) {
      dummy.position.set(wc3, WALL_HEIGHT + 0.03, wr3);
      dummy.updateMatrix();
      capMesh.setMatrixAt(idx++, dummy.matrix);
    }
  }
  capMesh.instanceMatrix.needsUpdate = true;
  scene.add(capMesh);

  // Keys (shared geo tracked for single disposal)
  var keyGeo = new THREE.BoxGeometry(0.3, 0.3, 0.1);
  sharedGeos.push(keyGeo);
  for (var kki = 0; kki < keyPositions.length; kki++) {
    var kr = keyPositions[kki][0], kc = keyPositions[kki][1];
    var kMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffd700, emissiveIntensity: 1.0, metalness: 0.9, roughness: 0.1 });
    var kMesh = new THREE.Mesh(keyGeo, kMat);
    kMesh.position.set(kc, 0.8, kr); kMesh.castShadow = true;
    scene.add(kMesh);
    var kLight = new THREE.PointLight(0xffd700, 0.5, 3);
    kLight.position.set(kc, 1.0, kr);
    scene.add(kLight);
    keyObjects.push({ mesh: kMesh, light: kLight, gridR: kr, gridC: kc, collected: false });
  }

  // Exit gate
  var eGeo = new THREE.BoxGeometry(0.8, 2, 0.2);
  var eMat = new THREE.MeshStandardMaterial({ color: 0x00ff88, emissive: 0x00ff88, emissiveIntensity: 0.3, transparent: true, opacity: 0.8 });
  exitMesh = new THREE.Mesh(eGeo, eMat);
  exitMesh.position.set(exitGridC, 1, exitGridR);
  scene.add(exitMesh);
  exitLight = new THREE.PointLight(0x00ff88, 0.3, 4);
  exitLight.position.set(exitGridC, 1.5, exitGridR);
  scene.add(exitLight);

  // Directional sunlight with proper shadow coverage
  if (!dirLight) {
    dirLight = new THREE.DirectionalLight(0xffffee, 0.8);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    dirLight.shadow.bias = -0.0005;
    dirLight.shadow.normalBias = 0.02;
    scene.add(dirLight);
    scene.add(dirLight.target);
  }
  var halfShadow = gridSize * 0.7;
  dirLight.position.set(gridSize / 2 + gridSize * 0.4, 18, gridSize / 2 - gridSize * 0.3);
  dirLight.target.position.set(gridSize / 2, 0, gridSize / 2);
  dirLight.shadow.camera.left = -halfShadow;
  dirLight.shadow.camera.right = halfShadow;
  dirLight.shadow.camera.top = halfShadow;
  dirLight.shadow.camera.bottom = -halfShadow;
  dirLight.shadow.camera.near = 1;
  dirLight.shadow.camera.far = 50;
  dirLight.shadow.camera.updateProjectionMatrix();

  // Shadow enemies
  var passageCells = [];
  for (var sr2 = 1; sr2 < gridSize - 1; sr2 += 2) for (var sc2 = 1; sc2 < gridSize - 1; sc2 += 2) {
    if (mazeGrid[sr2][sc2] === 1) {
      var dd = distMap[sr2 + ',' + sc2] || 0;
      if (dd > 6) passageCells.push([sr2, sc2, dd]);
    }
  }
  passageCells.sort(function(a, b) { return b[2] - a[2]; });

  var enemyGeo = new THREE.BoxGeometry(ENEMY_SIZE, 0.8, ENEMY_SIZE);
  sharedGeos.push(enemyGeo);
  var enemyColors = [0xdd2222, 0xcc4400, 0xaa0044, 0xdd0066, 0xbb3300];

  for (var si = 0; si < config.numShadows && si < passageCells.length; si++) {
    var sCell = passageCells[si * 2 % passageCells.length];
    var sR = sCell[0], sC = sCell[1];
    var others = passageCells.filter(function(c) { return Math.abs(c[0]-sR) + Math.abs(c[1]-sC) > 4 && Math.abs(c[0]-sR) + Math.abs(c[1]-sC) < 14; });
    var patrolPath = null;
    if (others.length > 0) {
      var target = others[Math.floor(Math.random() * others.length)];
      patrolPath = bfs(mazeGrid, sR, sC, target[0], target[1]);
    }
    if (!patrolPath || patrolPath.length < 3) {
      patrolPath = [[sR, sC]];
      var sdirs = [[-1,0],[1,0],[0,-1],[0,1]];
      for (var sdi = 0; sdi < 4; sdi++) {
        var pr = sR + sdirs[sdi][0], pc = sC + sdirs[sdi][1];
        while (pr >= 0 && pr < gridSize && pc >= 0 && pc < gridSize && mazeGrid[pr][pc] === 1) {
          patrolPath.push([pr, pc]); pr += sdirs[sdi][0]; pc += sdirs[sdi][1];
        }
        if (patrolPath.length > 3) break;
      }
    }

    var eColor = enemyColors[si % enemyColors.length];
    var sGroup = new THREE.Group();
    var sMat = new THREE.MeshStandardMaterial({ color: eColor, emissive: eColor, emissiveIntensity: 0.4, roughness: 0.3, metalness: 0.2 });
    sGroup.add(new THREE.Mesh(enemyGeo, sMat));
    sGroup.position.set(sC, ENEMY_Y, sR);
    scene.add(sGroup);
    shadowObjects.push({ group: sGroup, path: patrolPath, pathIdx: 0, dir: 1, speed: config.shadowSpeed, chaseTimer: 0, bobPhase: Math.random() * 6.28 });
  }
}

// ── Clear level ──
function clearLevel() {
  if (wallMesh) { scene.remove(wallMesh); wallMesh.geometry.dispose(); wallMesh.material.dispose(); wallMesh = null; }
  if (floorMesh) { scene.remove(floorMesh); floorMesh.geometry.dispose(); floorMesh.material.dispose(); floorMesh = null; }
  if (ceilMesh) { scene.remove(ceilMesh); ceilMesh.geometry.dispose(); ceilMesh.material.dispose(); ceilMesh = null; }
  if (capMesh) { scene.remove(capMesh); capMesh.material.dispose(); capMesh = null; }
  if (tileMesh) { scene.remove(tileMesh); tileMesh.material.dispose(); tileMesh = null; }
  for (var k = 0; k < torchLights.length; k++) scene.remove(torchLights[k].light);
  torchLights = [];
  for (var i = 0; i < keyObjects.length; i++) {
    scene.remove(keyObjects[i].mesh); scene.remove(keyObjects[i].light);
    keyObjects[i].mesh.material.dispose();
  }
  keyObjects = [];
  if (exitMesh) { scene.remove(exitMesh); exitMesh.geometry.dispose(); exitMesh.material.dispose(); exitMesh = null; }
  if (exitLight) { scene.remove(exitLight); exitLight = null; }
  for (var j = 0; j < shadowObjects.length; j++) {
    scene.remove(shadowObjects[j].group);
    shadowObjects[j].group.traverse(function(obj) { if (obj.material) obj.material.dispose(); });
  }
  shadowObjects = [];
  for (var g = 0; g < sharedGeos.length; g++) sharedGeos[g].dispose();
  sharedGeos = [];
}

// ── Player update ──
function updatePlayer(delta) {
  var moveSpeed = PLAYER_SPEED * delta;
  var turnSpeed = TURN_SPEED * delta;

  // Both Arrow Keys and WASD: Left/A = turn left, Right/D = turn right
  if (inputKeys['ArrowLeft'] || inputKeys['a'] || inputKeys['A']) yaw += turnSpeed;
  if (inputKeys['ArrowRight'] || inputKeys['d'] || inputKeys['D']) yaw -= turnSpeed;

  // Forward/backward relative to where camera faces
  var fwdX = -Math.sin(yaw), fwdZ = -Math.cos(yaw);
  var dx = 0, dz = 0;
  if (inputKeys['ArrowUp'] || inputKeys['w'] || inputKeys['W']) { dx += fwdX * moveSpeed; dz += fwdZ * moveSpeed; }
  if (inputKeys['ArrowDown'] || inputKeys['s'] || inputKeys['S']) { dx -= fwdX * moveSpeed; dz -= fwdZ * moveSpeed; }
  isMoving = dx !== 0 || dz !== 0;

  if (dx !== 0 && !collidesWithWall(playerX + dx, playerZ, PLAYER_RADIUS)) playerX += dx;
  if (dz !== 0 && !collidesWithWall(playerX, playerZ + dz, PLAYER_RADIUS)) playerZ += dz;

  // Head bob with smooth ease in/out
  var prevBobSin = Math.sin(bobTimer);
  if (isMoving) {
    bobTimer += delta * BOB_SPEED;
    bobIntensity = Math.min(1, bobIntensity + delta * 5);
  } else {
    bobIntensity = Math.max(0, bobIntensity - delta * 5);
    if (bobIntensity < 0.01) bobTimer = 0;
  }
  var curBobSin = Math.sin(bobTimer);

  // Sync footstep sounds to bob zero-crossings (each crossing = one step)
  if (isMoving && bobIntensity > 0.3) {
    if ((prevBobSin >= 0 && curBobSin < 0) || (prevBobSin <= 0 && curBobSin > 0)) {
      lastFootstepSide = 1 - lastFootstepSide;
      audioManager.play(lastFootstepSide ? 'footstep' : 'footstep2');
    }
  }

  var bobY = curBobSin * BOB_AMP_Y * bobIntensity;
  var bobSway = Math.cos(bobTimer * 0.5) * BOB_AMP_X * bobIntensity;
  var bobRoll = Math.sin(bobTimer * 0.5) * BOB_ROLL * bobIntensity;

  // Sway is perpendicular to facing direction
  var swayDx = Math.cos(yaw) * bobSway;
  var swayDz = -Math.sin(yaw) * bobSway;

  var shX = 0, shZ = 0;
  if (shakeTimer > 0) { shakeTimer -= delta; shX = (Math.random() - 0.5) * 0.06; shZ = (Math.random() - 0.5) * 0.06; }
  camera.position.set(playerX + shX + swayDx, PLAYER_HEIGHT + bobY, playerZ + shZ + swayDz);
  camera.rotation.order = 'YXZ'; camera.rotation.y = yaw; camera.rotation.x = 0; camera.rotation.z = bobRoll;

  var gc = Math.round(playerX), gr = Math.round(playerZ);
  if (gc >= 0 && gc < gridSize && gr >= 0 && gr < gridSize && mazeGrid[gr][gc] === 1) {
    var openC = 0;
    if (gr > 0 && mazeGrid[gr-1][gc] === 1) openC++;
    if (gr < gridSize-1 && mazeGrid[gr+1][gc] === 1) openC++;
    if (gc > 0 && mazeGrid[gr][gc-1] === 1) openC++;
    if (gc < gridSize-1 && mazeGrid[gr][gc+1] === 1) openC++;
    if (openC >= 3) checkpoint = { x: gc, z: gr };
  }

  var expR = 3;
  for (var edr = -expR; edr <= expR; edr++) for (var edc = -expR; edc <= expR; edc++) {
    var er = gr + edr, ec = gc + edc;
    if (er >= 0 && er < gridSize && ec >= 0 && ec < gridSize) explored[er][ec] = 1;
  }
  if (invincibleTimer > 0) invincibleTimer -= delta;
}

// ── Shadow update ──
function updateShadows(delta) {
  if (shadowNearCD > 0) shadowNearCD -= delta;
  for (var si = 0; si < shadowObjects.length; si++) {
    var shadow = shadowObjects[si];
    var path = shadow.path;
    if (!path || path.length < 2) continue;
    shadow.bobPhase += delta * 3;
    shadow.group.position.y = ENEMY_Y + Math.sin(shadow.bobPhase) * 0.06;
    shadow.group.rotation.y += delta * 1.5;

    var chasing = false;
    var sdx = playerX - shadow.group.position.x, sdz = playerZ - shadow.group.position.z;
    var pDist = Math.sqrt(sdx * sdx + sdz * sdz);

    if (pDist < 5 && shadowNearCD <= 0) { audioManager.play('shadowNear'); shadowNearCD = 3.0; }

    if (level >= 3 && pDist < 4) {
      chasing = true;
      shadow.chaseTimer -= delta;
      if (shadow.chaseTimer <= 0) {
        var sgr = Math.round(shadow.group.position.z), sgc = Math.round(shadow.group.position.x);
        var pgr = Math.round(playerZ), pgc = Math.round(playerX);
        if (sgr >= 0 && sgr < gridSize && sgc >= 0 && sgc < gridSize && mazeGrid[sgr][sgc] === 1 &&
            pgr >= 0 && pgr < gridSize && pgc >= 0 && pgc < gridSize && mazeGrid[pgr][pgc] === 1) {
          var cp = bfs(mazeGrid, sgr, sgc, pgr, pgc);
          if (cp && cp.length > 1) { shadow.path = cp; shadow.pathIdx = 0; shadow.dir = 1; path = cp; }
        }
        shadow.chaseTimer = 0.5;
      }
    }

    var target = path[shadow.pathIdx];
    if (!target) { shadow.dir *= -1; shadow.pathIdx = Math.max(0, Math.min(path.length - 1, shadow.pathIdx + shadow.dir)); continue; }
    var tx = target[1], tz = target[0];
    var tdx = tx - shadow.group.position.x, tdz = tz - shadow.group.position.z;
    var tDist = Math.sqrt(tdx * tdx + tdz * tdz);
    if (tDist < 0.15) {
      shadow.pathIdx += shadow.dir;
      if (shadow.pathIdx >= path.length) { shadow.dir = -1; shadow.pathIdx = path.length - 2; }
      else if (shadow.pathIdx < 0) { shadow.dir = 1; shadow.pathIdx = 1; }
    } else {
      var spd = (chasing ? shadow.speed * 1.3 : shadow.speed) * delta;
      shadow.group.position.x += (tdx / tDist) * Math.min(spd, tDist);
      shadow.group.position.z += (tdz / tDist) * Math.min(spd, tDist);
    }
    if (tDist > 0.01) shadow.group.rotation.y = Math.atan2(tdx, tdz);

    if (invincibleTimer <= 0) {
      var pdx2 = playerX - shadow.group.position.x, pdz2 = playerZ - shadow.group.position.z;
      if (Math.sqrt(pdx2 * pdx2 + pdz2 * pdz2) < PLAYER_RADIUS + ENEMY_SIZE * 0.6) {
        lives--; score = Math.max(0, score - 50);
        invincibleTimer = INVINCIBLE_DUR; shakeTimer = 0.3;
        audioManager.play('shadowHit');
        if (lives <= 0) { endGame(); return; }
        playerX = checkpoint.x; playerZ = checkpoint.z;
        camera.position.set(playerX, PLAYER_HEIGHT, playerZ);
      }
    }
  }
}

// ── Key update ──
function updateKeys(delta) {
  for (var i = 0; i < keyObjects.length; i++) {
    var key = keyObjects[i];
    if (key.collected) continue;
    key.mesh.rotation.y += delta * 2;
    key.mesh.position.y = 0.8 + Math.sin(Date.now() * 0.003) * 0.1;
    var kdx = playerX - key.mesh.position.x, kdz = playerZ - key.mesh.position.z;
    if (Math.sqrt(kdx * kdx + kdz * kdz) < 0.6) {
      key.collected = true; key.mesh.visible = false; key.light.intensity = 0;
      keysCollected++; totalKeysCollected++; score += 100;
      audioManager.play('keyCollect');
      if (keysCollected >= keysTotal) {
        exitMesh.material.emissiveIntensity = 1.5; exitLight.intensity = 1.2;
        audioManager.play('exitUnlock');
      }
    }
  }
}

function checkExit() {
  if (keysCollected < keysTotal) return false;
  var edx = playerX - exitGridC, edz = playerZ - exitGridR;
  return Math.sqrt(edx * edx + edz * edz) < 0.7;
}

// ── Timer ──
function updateTimer(delta) {
  timer -= delta; timeElapsed += delta;
  if (timer <= 15 && timer > 0) {
    var sec = Math.floor(timer);
    if (sec !== lastTickSec) { lastTickSec = sec; audioManager.play('timerTick'); }
  }
  if (timer <= 0) { timer = 0; endGame(); }
}

// ── Torch flicker ──
function updateTorches(delta) {
  for (var i = 0; i < torchLights.length; i++) {
    var t = torchLights[i];
    t.phase += delta * (4 + Math.random());
    t.light.intensity = t.base + Math.sin(t.phase) * 0.25 + (Math.random() - 0.5) * 0.15;
  }
}

// ── Minimap ──
function updateMinimap() {
  if (!minimapCtx) return;
  var mW = minimapCanvas.width, mH = minimapCanvas.height;
  var cW = mW / gridSize, cH = mH / gridSize;
  minimapCtx.fillStyle = '#000'; minimapCtx.fillRect(0, 0, mW, mH);
  for (var r = 0; r < gridSize; r++) for (var c = 0; c < gridSize; c++) {
    if (!explored[r][c]) continue;
    minimapCtx.fillStyle = mazeGrid[r][c] === 1 ? '#444' : '#252525';
    minimapCtx.fillRect(c * cW, r * cH, Math.ceil(cW), Math.ceil(cH));
  }
  for (var ki = 0; ki < keyObjects.length; ki++) {
    var k = keyObjects[ki]; if (k.collected) continue;
    if (explored[k.gridR] && explored[k.gridR][k.gridC]) {
      minimapCtx.fillStyle = '#ffd700';
      minimapCtx.fillRect(k.gridC * cW, k.gridR * cH, Math.ceil(cW), Math.ceil(cH));
    }
  }
  if (explored[exitGridR] && explored[exitGridR][exitGridC]) {
    minimapCtx.fillStyle = keysCollected >= keysTotal ? '#00ff88' : '#005533';
    minimapCtx.fillRect(exitGridC * cW, exitGridR * cH, Math.ceil(cW), Math.ceil(cH));
  }
  for (var si = 0; si < shadowObjects.length; si++) {
    var s = shadowObjects[si];
    var sgc = Math.round(s.group.position.x), sgr = Math.round(s.group.position.z);
    if (sgr >= 0 && sgr < gridSize && sgc >= 0 && sgc < gridSize && explored[sgr] && explored[sgr][sgc]) {
      minimapCtx.fillStyle = '#ff3333';
      minimapCtx.fillRect(sgc * cW, sgr * cH, Math.ceil(cW), Math.ceil(cH));
    }
  }
  // Player direction triangle
  var px = playerX * cW, py = playerZ * cH;
  var fX = -Math.sin(yaw), fZ = -Math.cos(yaw);
  var rX = Math.cos(yaw), rZ = -Math.sin(yaw);
  var tLen = Math.max(5, cW * 1.8);
  minimapCtx.fillStyle = '#00ff44';
  minimapCtx.beginPath();
  minimapCtx.moveTo(px + fX * tLen, py + fZ * tLen);
  minimapCtx.lineTo(px - fX * tLen * 0.4 + rX * tLen * 0.5, py - fZ * tLen * 0.4 + rZ * tLen * 0.5);
  minimapCtx.lineTo(px - fX * tLen * 0.4 - rX * tLen * 0.5, py - fZ * tLen * 0.4 - rZ * tLen * 0.5);
  minimapCtx.closePath();
  minimapCtx.fill();

  // FOV cone on minimap
  minimapCtx.strokeStyle = 'rgba(0,255,68,0.25)';
  minimapCtx.lineWidth = 1;
  var fovHalf = 0.7;
  var coneLen = tLen * 4;
  var coneL_x = -Math.sin(yaw + fovHalf) * coneLen, coneL_y = -Math.cos(yaw + fovHalf) * coneLen;
  var coneR_x = -Math.sin(yaw - fovHalf) * coneLen, coneR_y = -Math.cos(yaw - fovHalf) * coneLen;
  minimapCtx.beginPath();
  minimapCtx.moveTo(px, py);
  minimapCtx.lineTo(px + coneL_x, py + coneL_y);
  minimapCtx.moveTo(px, py);
  minimapCtx.lineTo(px + coneR_x, py + coneR_y);
  minimapCtx.stroke();
}

// ── HUD ──
function updateHUD() {
  if (!hudEl || hudEl.style.display === 'none') return;
  var hearts = '';
  for (var i = 0; i < 3; i++) hearts += '<span style="color:' + (i < lives ? '#ff4444' : '#333') + ';margin-right:2px;">&#9829;</span>';
  if (invincibleTimer > 0 && Math.floor(invincibleTimer * 6) % 2 === 0) hearts = '<span style="opacity:0.3">' + hearts + '</span>';
  hudLives.innerHTML = hearts;
  var mins = Math.floor(timer / 60), secs = Math.floor(timer % 60);
  hudTimer.textContent = mins + ':' + (secs < 10 ? '0' : '') + secs;
  hudTimer.style.color = timer < 15 ? '#ff3333' : '#fff';
  hudTimer.style.textShadow = timer < 15 ? '0 0 ' + (10 + Math.sin(Date.now() * 0.01) * 5) + 'px rgba(255,50,50,0.8)' : '0 0 10px rgba(255,100,0,0.5)';
  hudKeys.innerHTML = '\uD83D\uDD11 ' + keysCollected + '/' + keysTotal;
  hudLevel.textContent = 'Level ' + level;
  var scoreEl = document.getElementById('hud-score');
  if (scoreEl) scoreEl.textContent = 'Score: ' + score;
}

// ── End game ──
function endGame() {
  if (gameState !== 'playing') return;
  if (score > highScore) highScore = score;
  if (level > highestLevel) highestLevel = level;
  gameState = 'gameover';
  audioManager.play('gameOver');
  hudEl.style.display = 'none';
  gameOverEl.style.display = 'flex';
  var statsEl = document.getElementById('go-stats');
  if (statsEl) {
    statsEl.innerHTML = 'Level ' + level + ' reached<br>Keys collected: ' + totalKeysCollected + '<br>Score: ' + score + '<br>' +
      (score >= highScore && score > 0 ? '<span style="color:#ffd700;">\u2605 NEW HIGH SCORE! \u2605</span><br>' : '') +
      'High Score: ' + highScore;
  }
}

// ── Complete level ──
function completeLevel() {
  score += 500;
  score += Math.floor(timer) * 10;
  score += lives * 50;
  audioManager.play('levelUp');
  level++;
  if (level > highestLevel) highestLevel = level;
  setupLevel(level);
}

// ── Animation loop ──
function animate() {
  animationId = requestAnimationFrame(animate);
  var delta = Math.min(clock.getDelta(), 0.05);
  if (gameState === 'playing') {
    updatePlayer(delta);
    if (gameState !== 'playing') return;
    updateShadows(delta);
    if (gameState !== 'playing') return;
    updateKeys(delta);
    updateTimer(delta);
    if (gameState !== 'playing') return;
    updateTorches(delta);
    updateMinimap();
    updateHUD();
    if (checkExit()) completeLevel();
  }
  renderer.render(scene, camera);
}

// ── SloppyGame SDK ──
window.SloppyGame = {
  async init(cont, config) {
    container = cont;
    container.style.position = 'relative';
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87aacc);
    scene.fog = new THREE.FogExp2(0x87aacc, FOG_DENSITY);
    camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 80);
    camera.position.set(1, PLAYER_HEIGHT, 1);
    function onWindowResize() {
      var w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener('resize', onWindowResize);
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    scene.add(new THREE.HemisphereLight(0xddeeff, 0x886644, 0.45));
    clock = new THREE.Clock();
    createOverlays();
    animate();
    gameState = 'intro';
    window.parent.postMessage({ type: 'sloppy:game:ready' }, '*');
  },

  destroy: function() {
    if (animationId) cancelAnimationFrame(animationId);
    clearLevel();
    if (dirLight) { scene.remove(dirLight); dirLight = null; }
    if (scene) scene.traverse(function(obj) {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) { if (Array.isArray(obj.material)) obj.material.forEach(function(m){m.dispose();}); else obj.material.dispose(); }
    });
    if (renderer) { renderer.dispose(); if (renderer.domElement && renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement); }
    [hudEl, introEl, pauseEl, gameOverEl].forEach(function(el) { if (el && el.parentNode) el.parentNode.removeChild(el); });
    window.removeEventListener('resize', onWindowResize);
    audioManager.onDestroy();
    gameState = 'idle';
  },

  start: function() {
    gameState = 'intro';
    introEl.style.display = 'flex'; hudEl.style.display = 'none';
    pauseEl.style.display = 'none'; gameOverEl.style.display = 'none';
    var hsEl = document.getElementById('intro-hs');
    if (hsEl) hsEl.innerHTML = highestLevel > 0 ? 'Highest Level: ' + highestLevel + ' | High Score: ' + highScore : '';
  },

  pause: function() {
    if (gameState !== 'playing') return;
    audioManager.play('uiSelect');
    gameState = 'paused'; pauseEl.style.display = 'flex';
    audioManager.onPause();
  },

  resume: function() {
    if (gameState !== 'paused') return;
    gameState = 'playing'; pauseEl.style.display = 'none';
    clock.getDelta();
    audioManager.onResume();
    audioManager.play('uiSelect');
  },

  restart: function() {
    pauseEl.style.display = 'none'; gameOverEl.style.display = 'none'; introEl.style.display = 'none';
    score = 0; lives = 3; level = 1; keysCollected = 0; totalKeysCollected = 0; timeElapsed = 0;
    setupLevel(1); gameState = 'playing'; hudEl.style.display = 'block'; clock.getDelta();
  },

  renderIntroScreen: function() {
    gameState = 'intro'; hudEl.style.display = 'none'; pauseEl.style.display = 'none';
    gameOverEl.style.display = 'none'; introEl.style.display = 'flex';
  },

  renderPauseScreen: function() {
    if (gameState === 'playing') { gameState = 'paused'; pauseEl.style.display = 'flex'; }
  },

  renderGameOverScreen: function(scoreResult) {
    if (scoreResult && typeof scoreResult.score === 'number') score = scoreResult.score;
    endGame();
  },

  renderHUD: function() { updateHUD(); },

  getState: function() { return gameState; },

  getScore: function() {
    return { score: score, level: level, timeElapsed: Math.floor(timeElapsed),
      customData: { lives: lives, keysCollected: totalKeysCollected, highScore: highScore, highestLevel: highestLevel } };
  },

  metadata: {
    title: 'Labyrinth', genre: '3d-firstperson', engine: 'threejs',
    supportsMultiplayer: false,
    controls: [
      { key: 'W / Up Arrow', action: 'Move forward' },
      { key: 'S / Down Arrow', action: 'Move backward' },
      { key: 'A / Left Arrow', action: 'Turn left' },
      { key: 'D / Right Arrow', action: 'Turn right' },
      { key: 'Escape', action: 'Pause' }
    ],
    estimatedPlayTime: '3-10 min'
  },
  supportsMultiplayer: false
};

window.game = window.SloppyGame;

window.triggerGameOver = function() {
  if (gameState === 'playing') endGame();
};

window.addEventListener('message', function(e) {
  if (!e.data || !e.data.type) return;
  var g = window.SloppyGame;
  switch (e.data.type) {
    case 'sloppy:command':
      var cmd = e.data.command;
      if (cmd === 'start' && g.start) g.start();
      if (cmd === 'pause' && g.pause) g.pause();
      if (cmd === 'resume' && g.resume) g.resume();
      if (cmd === 'restart' && g.restart) g.restart();
      break;
    case 'sloppy:mute':
      if (typeof audioManager !== 'undefined') audioManager.mute();
      break;
    case 'sloppy:unmute':
      if (typeof audioManager !== 'undefined') audioManager.unmute();
      break;
  }
});

(function boot() {
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', boot); return; }
  window.SloppyGame.init(document.body, { container: document.body, width: W, height: H })
    .catch(function(err) {
      window.parent.postMessage({ type: 'sloppy:game:error', message: err.message || 'init failed', stack: err.stack || '' }, '*');
    });
})();

// Touch Controls for Labyrinth (virtual joystick)
(function(){
  if(!('ontouchstart' in window))return;
  var touchId=null,startX=0,startY=0,curX=0,curY=0;
  var tKeys={w:false,s:false,a:false,d:false};
  function setK(k,v){if(tKeys[k]===v)return;tKeys[k]=v;inputKeys[k]=v;}
  function update(){
    var dx=curX-startX,dy=curY-startY,dz=15;
    setK('w',dy<-dz);setK('s',dy>dz);setK('a',dx<-dz);setK('d',dx>dz);
  }
  function clear(){setK('w',false);setK('s',false);setK('a',false);setK('d',false);}
  document.addEventListener('touchstart',function(e){
    if(gameState==='intro'){audioManager.play('uiConfirm');startGame();e.preventDefault();return;}
    if(gameState==='gameover'){audioManager.play('uiConfirm');window.SloppyGame.restart();e.preventDefault();return;}
    if(touchId!==null)return;
    var t=e.changedTouches[0];touchId=t.identifier;
    startX=t.clientX;startY=t.clientY;curX=startX;curY=startY;
    e.preventDefault();
  },{passive:false});
  document.addEventListener('touchmove',function(e){
    for(var i=0;i<e.changedTouches.length;i++){
      if(e.changedTouches[i].identifier===touchId){
        curX=e.changedTouches[i].clientX;curY=e.changedTouches[i].clientY;update();
      }
    }
    e.preventDefault();
  },{passive:false});
  document.addEventListener('touchend',function(e){
    for(var i=0;i<e.changedTouches.length;i++){
      if(e.changedTouches[i].identifier===touchId){touchId=null;clear();}
    }
  });
  document.addEventListener('touchcancel',function(e){
    for(var i=0;i<e.changedTouches.length;i++){
      if(e.changedTouches[i].identifier===touchId){touchId=null;clear();}
    }
  });
})();

// Sloppy Touch Controls Bridge
(function(){if(!('ontouchstart' in window))return;var kc={ArrowUp:38,ArrowDown:40,ArrowLeft:37,ArrowRight:39,Space:32,KeyX:88,KeyZ:90,KeyC:67,KeyW:87,KeyA:65,KeyS:83,KeyD:68};window.addEventListener('message',function(e){if(e.data&&e.data.type==='sloppy:touch'){var input=e.data.input;if(!input)return;if(input.key){var evType=input.type==='touch:release'?'keyup':'keydown';var evt=new KeyboardEvent(evType,{key:input.key,code:input.key,keyCode:kc[input.key]||0,which:kc[input.key]||0,bubbles:true,cancelable:true});document.dispatchEvent(evt);}}});})();
</script>
