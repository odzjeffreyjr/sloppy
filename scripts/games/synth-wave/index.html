</head>
<body>
<script>

const SFX = {
  perfect:  [1,,660,.01,.05,.15,1,1.5,,,200,.05],
  great:    [.8,,440,.01,.04,.12,1,1.2,,,100,.04],
  good:     [.6,,330,.01,.03,.08,1,1],
  miss:     [.5,.1,100,.01,.05,.1,4,.5,,,-50],
  combo5:   [1.5,.8,270,,.1,,1,1.5,,,,,,.1,.01],
  combo10:  [1.5,,880,,.06,.04,,1.3,,7,,,,6],
  confirm:  [,,660,,.05,.1,1,1.5],
  select:   [,,440,,.03,.03,1,2,,,100,.03],
  gameOver: [,,925,.04,.3,.6,1,.3,,6.27,-184,.09,.17],
  healthLow:[.4,,180,.01,.08,.15,4,.8],
  bpmUp:    [,,537,.02,.02,.22,1,1.59,-6.98,4.97],
  tick:     [.2,,880,.005,.01,.02,1,2],
  laneFlash:[.3,,220,.005,.02,.05,1,1.5,,,50],
  healPing: [.5,,990,.01,.03,.1,1,1.8,,,300,.04]
};

function createAudioManager(opts) {

const audioManager = createAudioManager();

const W = 960, H = 540;
const LANE_COUNT = 4;
const LANE_COLORS = [0x00ffff, 0xff00ff, 0xffff00, 0x00ff66];
const LANE_COLOR_STRS = ['#00ffff', '#ff00ff', '#ffff00', '#00ff66'];
const LANE_KEYS = ['D', 'F', 'J', 'K'];
const LANE_WIDTH = 80;
const LANE_GAP = 10;
const TOTAL_LANES_WIDTH = LANE_COUNT * LANE_WIDTH + (LANE_COUNT - 1) * LANE_GAP;
const LANES_X_START = (W - TOTAL_LANES_WIDTH) / 2;
const HIT_ZONE_Y = H - 80;
const NOTE_SIZE = 24;

const PERFECT_WINDOW = 35;
const GREAT_WINDOW = 70;
const GOOD_WINDOW = 110;

let gameState = 'idle';
let score = 0;
let displayScore = 0;
let highScore = 0;
let combo = 0;
let maxCombo = 0;
let health = 100;
let bpm = 100;
let totalNotes = 0;
let perfectCount = 0;
let greatCount = 0;
let goodCount = 0;
let missCount = 0;
let elapsedMs = 0;
let phaserGame = null;
let rngSeed = Date.now();

function seededRandom() {
  rngSeed = (rngSeed * 1664525 + 1013904223) & 0xffffffff;
  return (rngSeed >>> 0) / 0xffffffff;
}

function laneX(lane) {
  return LANES_X_START + lane * (LANE_WIDTH + LANE_GAP) + LANE_WIDTH / 2;
}

// ── BootScene ───────────────────────────────────────────────────────────────

class BootScene extends Phaser.Scene {
  constructor() { super('BootScene'); }

  create() {
    const g = this.add.graphics();

    for (let i = 0; i < LANE_COUNT; i++) {
      const color = LANE_COLORS[i];
      g.fillStyle(color, 1);
      g.beginPath();
      g.moveTo(NOTE_SIZE / 2, 0);
      g.lineTo(NOTE_SIZE, NOTE_SIZE / 2);
      g.lineTo(NOTE_SIZE / 2, NOTE_SIZE);
      g.lineTo(0, NOTE_SIZE / 2);
      g.closePath();
      g.fillPath();
      g.generateTexture('note_' + i, NOTE_SIZE, NOTE_SIZE);
      g.clear();

      g.fillStyle(color, 1);
      g.fillCircle(4, 4, 4);
      g.generateTexture('particle_' + i, 8, 8);
      g.clear();
    }

    g.fillStyle(0xffffff, 1);
    g.fillCircle(2, 2, 2);
    g.generateTexture('star', 4, 4);
    g.clear();

    g.fillStyle(0xffffff, 0.8);
    g.fillCircle(3, 3, 3);
    g.generateTexture('particle_white', 6, 6);
    g.clear();

    g.destroy();
    this.scene.start('IntroScene');
  }
}

// ── IntroScene ──────────────────────────────────────────────────────────────

class IntroScene extends Phaser.Scene {
  constructor() { super('IntroScene'); }

  create() {
    this.cameras.main.setBackgroundColor('#0a0014');
    gameState = 'intro';

    const bgGrad = this.add.graphics();
    bgGrad.fillGradientStyle(0x1a0033, 0x1a0033, 0x330066, 0x330066, 1);
    bgGrad.fillRect(0, 0, W, H);

    this.drawRetroSun(W / 2, H * 0.55, 120);

    for (let i = 0; i < 60; i++) {
      const s = this.add.image(Phaser.Math.Between(0, W), Phaser.Math.Between(0, H * 0.5), 'star');
      s.setAlpha(Phaser.Math.FloatBetween(0.2, 0.7));
      s.setScale(Phaser.Math.FloatBetween(0.3, 1.2));
      s.setData('twinkleSpeed', Phaser.Math.FloatBetween(0.5, 2));
    }

    const title = this.add.text(W / 2, H * 0.22, 'SYNTH WAVE', {
      fontFamily: 'monospace', fontSize: '58px', fontStyle: 'bold',
      color: '#ff00ff', stroke: '#660066', strokeThickness: 6
    }).setOrigin(0.5);
    title.setShadow(4, 4, '#ff00ff', 16, true, true);

    this.tweens.add({
      targets: title, scaleX: 1.05, scaleY: 1.05, duration: 1400,
      yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
    });

    const sub = this.add.text(W / 2, H * 0.35, 'Ride the synthwave', {
      fontFamily: 'monospace', fontSize: '14px', color: '#cc66ff'
    }).setOrigin(0.5);

    const keysY = H * 0.52;
    for (let i = 0; i < LANE_COUNT; i++) {
      const kx = W / 2 - 90 + i * 60;
      this.add.rectangle(kx, keysY, 40, 40, LANE_COLORS[i], 0.15).setStrokeStyle(2, LANE_COLORS[i], 0.6);
      this.add.text(kx, keysY, LANE_KEYS[i], {
        fontFamily: 'monospace', fontSize: '22px', fontStyle: 'bold', color: LANE_COLOR_STRS[i]
      }).setOrigin(0.5);
    }

    const startText = this.add.text(W / 2, H * 0.68, '[ Press any key to START ]', {
      fontFamily: 'monospace', fontSize: '16px', color: '#00ffff'
    }).setOrigin(0.5);

    this.tweens.add({
      targets: startText, alpha: 0.3, duration: 800,
      yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
    });

    if (highScore > 0) {
      this.add.text(W / 2, H * 0.78, 'High Score: ' + highScore, {
        fontFamily: 'monospace', fontSize: '15px', color: '#ffcc00'
      }).setOrigin(0.5);
    }

    this.add.text(W / 2, H * 0.90, 'sloppy games', {
      fontFamily: 'monospace', fontSize: '12px', color: '#334455'
    }).setOrigin(0.5);

    this.scanLines = this.add.graphics();
    for (let y = 0; y < H; y += 3) {
      this.scanLines.fillStyle(0x000000, 0.08);
      this.scanLines.fillRect(0, y, W, 1);
    }
    this.scanLines.setDepth(100);

    this.input.keyboard.once('keydown', () => this.startGame());
    this.input.once('pointerdown', () => this.startGame());
  }

  drawRetroSun(cx, cy, radius) {
    const g = this.add.graphics();
    const slices = 20;
    for (let i = 0; i < slices; i++) {
      const t = i / slices;
      const topColor = Phaser.Display.Color.Interpolate.ColorWithColor(
        new Phaser.Display.Color(255, 100, 0),
        new Phaser.Display.Color(255, 0, 128),
        slices, i
      );
      const color = Phaser.Display.Color.GetColor(topColor.r, topColor.g, topColor.b);
      const yStart = cy - radius + (radius * 2 * t);
      const yEnd = cy - radius + (radius * 2 * (t + 1 / slices));

      const halfW = Math.sqrt(Math.max(0, radius * radius - Math.pow(yStart - cy, 2)));
      if (halfW <= 0) continue;

      g.fillStyle(color, 0.7);
      g.fillRect(cx - halfW, yStart, halfW * 2, yEnd - yStart);

      if (i > slices / 2 && i % 2 === 0) {
        g.fillStyle(0x0a0014, 0.9);
        g.fillRect(cx - halfW, yStart, halfW * 2, 2);
      }
    }
    g.setDepth(0);
  }

  startGame() {
    audioManager.play('confirm');
    this.scene.start('GameScene');
    gameState = 'playing';
  }
}

// ── GameScene ───────────────────────────────────────────────────────────────

class GameScene extends Phaser.Scene {
  constructor() { super('GameScene'); }

  create() {
    this.cameras.main.setBackgroundColor('#0a0014');

    score = 0;
    displayScore = 0;
    combo = 0;
    maxCombo = 0;
    health = 100;
    bpm = 100;
    totalNotes = 0;
    perfectCount = 0;
    greatCount = 0;
    goodCount = 0;
    missCount = 0;
    elapsedMs = 0;
    rngSeed = Date.now();
    gameState = 'playing';

    this.beatInterval = 60000 / bpm;
    this.nextBeatTime = 0;
    this.bpmTimer = 0;
    this.patternComplexity = 0;
    this.lastRating = '';
    this.lastRatingTime = 0;
    this.notes = [];
    this.noteSprites = [];
    this.sunY = H * 0.25;

    this.drawBackground();
    this.drawLanes();
    this.drawHitZone();
    this.createHUD();

    this.keyD = this.input.keyboard.addKey('D');
    this.keyF = this.input.keyboard.addKey('F');
    this.keyJ = this.input.keyboard.addKey('J');
    this.keyK = this.input.keyboard.addKey('K');
    this.keyEsc = this.input.keyboard.addKey('ESC');

    this.input.keyboard.on('keydown-D', () => this.hitLane(0));
    this.input.keyboard.on('keydown-F', () => this.hitLane(1));
    this.input.keyboard.on('keydown-J', () => this.hitLane(2));
    this.input.keyboard.on('keydown-K', () => this.hitLane(3));

    this.notesFallTime = 1200;

    this.patternQueue = [];
    this.generatePatterns();
  }

  drawBackground() {
    this.bgGrad = this.add.graphics();
    this.bgGrad.fillGradientStyle(0x1a0033, 0x1a0033, 0x0a0014, 0x0a0014, 1);
    this.bgGrad.fillRect(0, 0, W, H);
    this.bgGrad.setDepth(-10);

    this.sunGraphics = this.add.graphics();
    this.drawSun();

    this.mountainGraphics = this.add.graphics();
    this.drawMountains();

    this.gridGraphics = this.add.graphics();
    this.gridPhase = 0;
    this.drawPerspectiveGrid();

    this.scanOverlay = this.add.graphics();
    for (let y = 0; y < H; y += 3) {
      this.scanOverlay.fillStyle(0x000000, 0.06);
      this.scanOverlay.fillRect(0, y, W, 1);
    }
    this.scanOverlay.setDepth(90);
  }

  drawSun() {
    this.sunGraphics.clear();
    const cx = W / 2, cy = this.sunY, radius = 80;
    const slices = 16;
    for (let i = 0; i < slices; i++) {
      const t = i / slices;
      const topColor = Phaser.Display.Color.Interpolate.ColorWithColor(
        new Phaser.Display.Color(255, 80, 0),
        new Phaser.Display.Color(255, 0, 100),
        slices, i
      );
      const color = Phaser.Display.Color.GetColor(topColor.r, topColor.g, topColor.b);
      const yStart = cy - radius + (radius * 2 * t);
      const yEnd = cy - radius + (radius * 2 * (t + 1 / slices));
      const halfW = Math.sqrt(Math.max(0, radius * radius - Math.pow(yStart - cy, 2)));
      if (halfW <= 0) continue;
      this.sunGraphics.fillStyle(color, 0.6);
      this.sunGraphics.fillRect(cx - halfW, yStart, halfW * 2, yEnd - yStart);
      if (i > slices / 2 && i % 2 === 0) {
        this.sunGraphics.fillStyle(0x0a0014, 0.8);
        this.sunGraphics.fillRect(cx - halfW, yStart, halfW * 2, 3);
      }
    }
    this.sunGraphics.setDepth(-5);
  }

  drawMountains() {
    this.mountainGraphics.clear();
    this.mountainGraphics.fillStyle(0x1a0033, 0.8);
    this.mountainGraphics.beginPath();
    this.mountainGraphics.moveTo(0, H * 0.55);
    for (let x = 0; x <= W; x += 40) {
      const h = Math.sin(x * 0.008) * 40 + Math.sin(x * 0.015) * 25 + Math.sin(x * 0.003) * 50;
      this.mountainGraphics.lineTo(x, H * 0.45 - h);
    }
    this.mountainGraphics.lineTo(W, H * 0.55);
    this.mountainGraphics.closePath();
    this.mountainGraphics.fillPath();

    this.mountainGraphics.fillStyle(0x0d001a, 0.9);
    this.mountainGraphics.beginPath();
    this.mountainGraphics.moveTo(0, H * 0.6);
    for (let x = 0; x <= W; x += 30) {
      const h = Math.sin(x * 0.012 + 2) * 30 + Math.sin(x * 0.02 + 1) * 20;
      this.mountainGraphics.lineTo(x, H * 0.52 - h);
    }
    this.mountainGraphics.lineTo(W, H * 0.6);
    this.mountainGraphics.closePath();
    this.mountainGraphics.fillPath();
    this.mountainGraphics.setDepth(-4);
  }

  drawPerspectiveGrid() {
    this.gridGraphics.clear();
    const horizonY = H * 0.55;
    const vanishX = W / 2;

    this.gridGraphics.lineStyle(1, 0xff00ff, 0.15);
    const lineCount = 14;
    for (let i = 0; i < lineCount; i++) {
      const spread = (i - lineCount / 2) * 120;
      this.gridGraphics.beginPath();
      this.gridGraphics.moveTo(vanishX, horizonY);
      this.gridGraphics.lineTo(vanishX + spread * 2, H);
      this.gridGraphics.strokePath();
    }

    const gridLineCount = 12;
    for (let i = 0; i < gridLineCount; i++) {
      const t = (i / gridLineCount + this.gridPhase) % 1;
      const y = horizonY + (H - horizonY) * t * t;
      const widthAtY = (y - horizonY) / (H - horizonY) * W * 1.5;
      this.gridGraphics.lineStyle(1, 0xff00ff, 0.1 * t);
      this.gridGraphics.beginPath();
      this.gridGraphics.moveTo(vanishX - widthAtY / 2, y);
      this.gridGraphics.lineTo(vanishX + widthAtY / 2, y);
      this.gridGraphics.strokePath();
    }
    this.gridGraphics.setDepth(-3);
  }

  drawLanes() {
    this.laneGraphics = this.add.graphics();
    for (let i = 0; i < LANE_COUNT; i++) {
      const x = LANES_X_START + i * (LANE_WIDTH + LANE_GAP);
      this.laneGraphics.fillStyle(LANE_COLORS[i], 0.04);
      this.laneGraphics.fillRect(x, 0, LANE_WIDTH, H);
      this.laneGraphics.lineStyle(1, LANE_COLORS[i], 0.12);
      this.laneGraphics.strokeRect(x, 0, LANE_WIDTH, H);
    }
    this.laneGraphics.setDepth(1);
  }

  drawHitZone() {
    this.hitZoneGraphics = this.add.graphics();
    this.hitZoneGlows = [];

    for (let i = 0; i < LANE_COUNT; i++) {
      const x = laneX(i);
      this.hitZoneGraphics.lineStyle(2, LANE_COLORS[i], 0.5);
      this.hitZoneGraphics.strokeRect(x - LANE_WIDTH / 2, HIT_ZONE_Y - 4, LANE_WIDTH, 8);
    }
    this.hitZoneGraphics.setDepth(5);

    for (let i = 0; i < LANE_COUNT; i++) {
      const glow = this.add.rectangle(laneX(i), HIT_ZONE_Y, LANE_WIDTH - 4, 12, LANE_COLORS[i], 0);
      glow.setDepth(6);
      this.hitZoneGlows.push(glow);
    }

    for (let i = 0; i < LANE_COUNT; i++) {
      this.add.text(laneX(i), H - 25, LANE_KEYS[i], {
        fontFamily: 'monospace', fontSize: '16px', fontStyle: 'bold', color: LANE_COLOR_STRS[i]
      }).setOrigin(0.5).setAlpha(0.4).setDepth(10);
    }
  }

  createHUD() {
    this.scoreText = this.add.text(20, 16, 'SCORE 0', {
      fontFamily: 'monospace', fontSize: '20px', fontStyle: 'bold', color: '#00ffff'
    }).setDepth(50);
    this.scoreText.setShadow(2, 2, '#006688', 6, true, true);

    this.comboText = this.add.text(W / 2, 20, '', {
      fontFamily: 'monospace', fontSize: '28px', fontStyle: 'bold', color: '#ffcc00'
    }).setOrigin(0.5, 0).setDepth(50);
    this.comboText.setShadow(2, 2, '#886600', 8, true, true);

    this.healthBarBg = this.add.rectangle(W - 130, 20, 110, 16, 0x222222, 0.6).setOrigin(0, 0).setDepth(50);
    this.healthBarFill = this.add.rectangle(W - 128, 22, 106, 12, 0x00ff66, 0.9).setOrigin(0, 0).setDepth(51);
    this.healthText = this.add.text(W - 20, 20, '100%', {
      fontFamily: 'monospace', fontSize: '12px', color: '#00ff66'
    }).setOrigin(1, 0).setDepth(52);

    this.bpmText = this.add.text(W - 20, H - 30, 'BPM 100', {
      fontFamily: 'monospace', fontSize: '13px', color: '#cc66ff'
    }).setOrigin(1, 0.5).setDepth(50);

    this.ratingText = this.add.text(W / 2, HIT_ZONE_Y - 50, '', {
      fontFamily: 'monospace', fontSize: '22px', fontStyle: 'bold', color: '#ffffff'
    }).setOrigin(0.5).setDepth(50).setAlpha(0);
  }

  generatePatterns() {
    const complexity = this.patternComplexity;
    const patternCount = 4 + Math.floor(complexity / 2);

    for (let p = 0; p < patternCount; p++) {
      const beatsInPattern = 4 + Math.floor(seededRandom() * 4);
      const pattern = [];

      for (let b = 0; b < beatsInPattern; b++) {
        const r = seededRandom();

        if (complexity < 1 || r < 0.6) {
          pattern.push([Math.floor(seededRandom() * LANE_COUNT)]);
        } else if (complexity < 3 || r < 0.8) {
          const l1 = Math.floor(seededRandom() * LANE_COUNT);
          let l2 = Math.floor(seededRandom() * LANE_COUNT);
          while (l2 === l1) l2 = Math.floor(seededRandom() * LANE_COUNT);
          pattern.push([l1, l2]);
        } else if (r < 0.9) {
          const start = Math.floor(seededRandom() * LANE_COUNT);
          const dir = seededRandom() > 0.5 ? 1 : -1;
          pattern.push([start]);
          if (b + 1 < beatsInPattern) {
            pattern.push([Phaser.Math.Clamp(start + dir, 0, LANE_COUNT - 1)]);
            b++;
          }
        } else {
          const l1 = Math.floor(seededRandom() * 2);
          const l2 = 2 + Math.floor(seededRandom() * 2);
          pattern.push([l1, l2]);
        }
      }

      this.patternQueue.push(...pattern);
    }
  }

  spawnNote(lane, targetTime) {
    const sprite = this.add.image(laneX(lane), -NOTE_SIZE, 'note_' + lane);
    sprite.setDepth(10);
    sprite.setScale(0.9);
    sprite.setAlpha(0.9);

    const note = {
      lane: lane,
      sprite: sprite,
      targetTime: targetTime,
      spawnTime: targetTime - this.notesFallTime,
      hit: false,
      missed: false
    };

    this.notes.push(note);
    totalNotes++;
  }

  hitLane(lane) {
    if (gameState !== 'playing') return;

    audioManager.play('laneFlash');

    this.hitZoneGlows[lane].setAlpha(0.7);
    this.tweens.add({
      targets: this.hitZoneGlows[lane],
      alpha: 0, duration: 150, ease: 'Power2'
    });

    const now = elapsedMs;
    let bestNote = null;
    let bestDiff = Infinity;

    for (const note of this.notes) {
      if (note.lane !== lane || note.hit || note.missed) continue;
      const diff = Math.abs(now - note.targetTime);
      if (diff < bestDiff && diff < GOOD_WINDOW) {
        bestDiff = diff;
        bestNote = note;
      }
    }

    if (!bestNote) {
      return;
    }

    bestNote.hit = true;
    const diff = bestDiff;
    let rating, points, color;

    if (diff <= PERFECT_WINDOW) {
      rating = 'PERFECT';
      points = 100;
      color = '#00ffff';
      perfectCount++;
      health = Math.min(100, health + 1);
      audioManager.play('perfect');
      audioManager.play('healPing');
      this.spawnHitParticles(bestNote.lane, 20);
    } else if (diff <= GREAT_WINDOW) {
      rating = 'GREAT';
      points = 50;
      color = '#ff00ff';
      greatCount++;
      audioManager.play('great');
      this.spawnHitParticles(bestNote.lane, 12);
    } else {
      rating = 'GOOD';
      points = 25;
      color = '#ffff00';
      goodCount++;
      audioManager.play('good');
    }

    combo++;
    if (combo > maxCombo) maxCombo = combo;
    const multiplier = Math.min(20, 1 + Math.floor(combo / 5));
    score += points * multiplier;

    if (combo === 5) audioManager.play('combo5');
    if (combo === 10) audioManager.play('combo10');
    if (combo % 20 === 0 && combo > 0) audioManager.play('combo10');

    this.showRating(rating, color);
    this.animateCombo();

    this.tweens.add({
      targets: bestNote.sprite,
      scaleX: 1.8, scaleY: 1.8, alpha: 0,
      duration: 150, ease: 'Power2',
      onComplete: () => bestNote.sprite.destroy()
    });
  }

  showRating(text, color) {
    this.ratingText.setText(text);
    this.ratingText.setColor(color);
    this.ratingText.setAlpha(1);
    this.ratingText.setScale(1.3);
    this.ratingText.y = HIT_ZONE_Y - 50;

    this.tweens.killTweensOf(this.ratingText);
    this.tweens.add({
      targets: this.ratingText,
      alpha: 0, y: HIT_ZONE_Y - 80, scaleX: 1, scaleY: 1,
      duration: 500, ease: 'Power2'
    });
  }

  animateCombo() {
    if (combo < 2) return;
    this.comboText.setScale(1.4);
    this.tweens.add({
      targets: this.comboText,
      scaleX: 1, scaleY: 1, duration: 200, ease: 'Back.easeOut'
    });
  }

  spawnHitParticles(lane, count) {
    const x = laneX(lane);
    const particles = this.add.particles(x, HIT_ZONE_Y, 'particle_' + lane, {
      speed: { min: 80, max: 250 },
      scale: { start: 1.2, end: 0 },
      alpha: { start: 1, end: 0 },
      lifespan: 500,
      blendMode: 'ADD',
      angle: { min: 220, max: 320 },
      quantity: count,
      emitting: false
    });
    particles.setDepth(15);
    particles.explode(count);
    this.time.delayedCall(600, () => particles.destroy());
  }

  onMiss(note) {
    if (note.missed || note.hit) return;
    note.missed = true;
    missCount++;
    combo = 0;
    health -= 5;

    audioManager.play('miss');

    if (health <= 20 && health > 0) {
      audioManager.play('healthLow');
    }

    this.tweens.add({
      targets: note.sprite,
      alpha: 0, y: note.sprite.y + 30,
      duration: 200,
      onComplete: () => note.sprite.destroy()
    });

    if (health <= 0) {
      health = 0;
      this.gameOver();
    }
  }

  gameOver() {
    if (gameState !== 'playing') return;
    gameState = 'gameover';
    audioManager.play('gameOver');

    if (score > highScore) highScore = score;

    this.cameras.main.shake(400, 0.015);

    const flash = this.add.rectangle(W / 2, H / 2, W, H, 0xff0044, 0).setDepth(200);
    this.tweens.add({
      targets: flash, alpha: 0.4, duration: 200,
      yoyo: true, onComplete: () => flash.destroy()
    });

    this.time.delayedCall(800, () => {
      this.scene.start('GameOverScene');
    });
  }

  update(time, delta) {
    if (gameState !== 'playing') return;

    elapsedMs += delta;
    this.bpmTimer += delta;

    if (this.bpmTimer >= 30000) {
      this.bpmTimer -= 30000;
      if (bpm < 160) {
        bpm += 5;
        this.beatInterval = 60000 / bpm;
        this.patternComplexity++;
        audioManager.play('bpmUp');
      }
    }

    if (elapsedMs >= this.nextBeatTime) {
      if (this.patternQueue.length === 0) {
        this.generatePatterns();
      }
      const lanes = this.patternQueue.shift();
      const targetTime = this.nextBeatTime + this.notesFallTime;

      for (const lane of lanes) {
        this.spawnNote(lane, targetTime);
      }

      this.nextBeatTime += this.beatInterval;
    }

    for (let i = this.notes.length - 1; i >= 0; i--) {
      const note = this.notes[i];
      if (note.hit) {
        if (!note.sprite || !note.sprite.active) {
          this.notes.splice(i, 1);
        }
        continue;
      }

      const progress = (elapsedMs - note.spawnTime) / this.notesFallTime;
      const noteY = -NOTE_SIZE + (HIT_ZONE_Y + NOTE_SIZE) * progress;
      note.sprite.y = noteY;

      const glowProgress = Math.max(0, progress - 0.5) * 2;
      note.sprite.setAlpha(0.6 + glowProgress * 0.4);
      note.sprite.setScale(0.8 + glowProgress * 0.3);

      if (elapsedMs > note.targetTime + GOOD_WINDOW) {
        this.onMiss(note);
      }

      if (note.missed && (!note.sprite || !note.sprite.active)) {
        this.notes.splice(i, 1);
      }
    }

    this.gridPhase = (this.gridPhase + delta * 0.0003 * (bpm / 100)) % 1;
    this.drawPerspectiveGrid();

    this.sunY += delta * 0.002;
    if (this.sunY > H * 0.45) this.sunY = H * 0.25;
    this.drawSun();

    if (Phaser.Input.Keyboard.JustDown(this.keyEsc)) {
      this.scene.launch('PauseScene');
      this.scene.pause();
      gameState = 'paused';
      audioManager.onPause();
      return;
    }

    this.renderHUD();
  }

  renderHUD() {
    displayScore += (score - displayScore) * 0.15;
    if (Math.abs(score - displayScore) < 1) displayScore = score;
    this.scoreText.setText('SCORE ' + Math.floor(displayScore));

    if (combo >= 2) {
      const multiplier = Math.min(20, 1 + Math.floor(combo / 5));
      this.comboText.setText('x' + multiplier + ' COMBO ' + combo);
      this.comboText.setAlpha(1);
    } else {
      this.comboText.setAlpha(0);
    }

    const healthPct = health / 100;
    this.healthBarFill.setScale(healthPct, 1);
    if (health > 60) {
      this.healthBarFill.setFillStyle(0x00ff66, 0.9);
      this.healthText.setColor('#00ff66');
    } else if (health > 30) {
      this.healthBarFill.setFillStyle(0xffcc00, 0.9);
      this.healthText.setColor('#ffcc00');
    } else {
      this.healthBarFill.setFillStyle(0xff3333, 0.9);
      this.healthText.setColor('#ff3333');
    }
    this.healthText.setText(Math.ceil(health) + '%');

    this.bpmText.setText('BPM ' + bpm);
  }
}

// ── PauseScene ──────────────────────────────────────────────────────────────

class PauseScene extends Phaser.Scene {
  constructor() { super('PauseScene'); }

  create() {
    this.add.rectangle(W / 2, H / 2, W, H, 0x1a0033, 0.85).setDepth(0);

    const pauseTitle = this.add.text(W / 2, H * 0.36, 'PAUSED', {
      fontFamily: 'monospace', fontSize: '48px', fontStyle: 'bold', color: '#ff00ff'
    }).setOrigin(0.5).setDepth(1);
    pauseTitle.setShadow(3, 3, '#ff00ff', 12, true, true);

    this.tweens.add({
      targets: pauseTitle, alpha: 0.5, duration: 1000,
      yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
    });

    this.add.text(W / 2, H * 0.50, 'Score: ' + score, {
      fontFamily: 'monospace', fontSize: '22px', color: '#cc88ff'
    }).setOrigin(0.5).setDepth(1);

    const resumeText = this.add.text(W / 2, H * 0.64, '[ Press ESC or CLICK to Resume ]', {
      fontFamily: 'monospace', fontSize: '16px', color: '#00ffff'
    }).setOrigin(0.5).setDepth(1);

    this.tweens.add({
      targets: resumeText, alpha: 0.3, duration: 800,
      yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
    });

    this.input.once('pointerdown', () => this.resumeGame());
    this.input.keyboard.once('keydown-ESC', () => this.resumeGame());
  }

  resumeGame() {
    audioManager.play('confirm');
    audioManager.onResume();
    gameState = 'playing';
    this.scene.stop();
    this.scene.resume('GameScene');
  }
}

// ── GameOverScene ───────────────────────────────────────────────────────────

class GameOverScene extends Phaser.Scene {
  constructor() { super('GameOverScene'); }

  create() {
    this.cameras.main.setBackgroundColor('#0a0014');
    this.add.rectangle(W / 2, H / 2, W, H, 0x0a0014, 0.92);

    const goText = this.add.text(W / 2, H * 0.18, 'GAME OVER', {
      fontFamily: 'monospace', fontSize: '50px', fontStyle: 'bold', color: '#ff3366'
    }).setOrigin(0.5).setScale(0);
    goText.setShadow(3, 3, '#ff3366', 12, true, true);

    this.tweens.add({
      targets: goText, scaleX: 1, scaleY: 1, duration: 500, ease: 'Back.easeOut'
    });

    this.tweens.add({
      targets: goText, alpha: 0.4, duration: 600,
      yoyo: true, repeat: -1, ease: 'Sine.easeInOut', delay: 600
    });

    this.add.text(W / 2, H * 0.34, 'Score: ' + score, {
      fontFamily: 'monospace', fontSize: '30px', fontStyle: 'bold', color: '#00ffff'
    }).setOrigin(0.5);

    if (score >= highScore && highScore > 0) {
      const hsText = this.add.text(W / 2, H * 0.44, 'NEW HIGH SCORE!', {
        fontFamily: 'monospace', fontSize: '20px', fontStyle: 'bold', color: '#ffcc00'
      }).setOrigin(0.5);
      this.tweens.add({
        targets: hsText, alpha: 0.4, duration: 400,
        yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
      });
    } else if (highScore > 0) {
      this.add.text(W / 2, H * 0.44, 'Best: ' + highScore, {
        fontFamily: 'monospace', fontSize: '16px', color: '#667788'
      }).setOrigin(0.5);
    }

    this.add.text(W / 2, H * 0.52, 'Max Combo: ' + maxCombo, {
      fontFamily: 'monospace', fontSize: '16px', color: '#ffcc00'
    }).setOrigin(0.5);

    const total = perfectCount + greatCount + goodCount + missCount;
    const accuracy = total > 0 ? ((perfectCount + greatCount + goodCount) / total * 100).toFixed(1) : '0.0';
    const accColor = parseFloat(accuracy) >= 90 ? '#00ff66' : parseFloat(accuracy) >= 70 ? '#ffcc00' : '#ff6644';

    this.add.text(W / 2, H * 0.60, 'Accuracy: ' + accuracy + '%', {
      fontFamily: 'monospace', fontSize: '16px', color: accColor
    }).setOrigin(0.5);

    this.add.text(W / 2, H * 0.68, [
      'Perfect: ' + perfectCount + '  Great: ' + greatCount,
      'Good: ' + goodCount + '  Miss: ' + missCount
    ].join('\n'), {
      fontFamily: 'monospace', fontSize: '12px', color: '#556677', align: 'center'
    }).setOrigin(0.5).setLineSpacing(4);

    const replayText = this.add.text(W / 2, H * 0.82, '[ Press any key to PLAY AGAIN ]', {
      fontFamily: 'monospace', fontSize: '16px', color: '#00ffff'
    }).setOrigin(0.5);

    this.tweens.add({
      targets: replayText, alpha: 0.3, duration: 800,
      yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
    });

    for (let y = 0; y < H; y += 3) {
      this.add.rectangle(W / 2, y, W, 1, 0x000000, 0.06);
    }

    this.input.keyboard.once('keydown', () => this.restartGame());
    this.input.once('pointerdown', () => this.restartGame());
  }

  restartGame() {
    audioManager.play('confirm');
    gameState = 'playing';
    this.scene.start('GameScene');
  }
}

// ── SloppyGame Adapter (SDK v2 Contract) ────────────────────────────────────

window.SloppyGame = {
  metadata: {
    title: 'Synth Wave',
    genre: '2d-rhythm',
    engine: 'phaser3',
    supportsMultiplayer: false,
    controls: [
      { key: 'D', action: 'Lane 1 (cyan)' },
      { key: 'F', action: 'Lane 2 (magenta)' },
      { key: 'J', action: 'Lane 3 (yellow)' },
      { key: 'K', action: 'Lane 4 (green)' },
      { key: 'Escape', action: 'Pause' }
    ],
    estimatedPlayTime: '1-5 min'
  },
  supportsMultiplayer: false,

  async init(container, config) {
    try {
      phaserGame = new Phaser.Game({
        type: Phaser.AUTO,
        parent: container,
        width: config.width || W,
        height: config.height || H,
        backgroundColor: '#0a0014',
        scene: [BootScene, IntroScene, GameScene, PauseScene, GameOverScene],
        scale: {
          mode: Phaser.Scale.FIT,
          autoCenter: Phaser.Scale.CENTER_BOTH
        }
      });

      gameState = 'idle';

      await new Promise(resolve => {
        phaserGame.events.once('ready', resolve);
      });

      window.parent.postMessage({ type: 'sloppy:game:ready' }, '*');
    } catch (err) {
      window.parent.postMessage({
        type: 'sloppy:game:error',
        message: err.message,
        stack: err.stack
      }, '*');
      throw err;
    }
  },

  destroy() {
    audioManager.onDestroy();
    if (phaserGame) {
      phaserGame.destroy(true);
      phaserGame = null;
    }
    gameState = 'idle';
  },

  start() {
    if (phaserGame) {
      phaserGame.scene.start('IntroScene');
      gameState = 'intro';
    }
  },

  pause() {
    if (gameState !== 'playing' || !phaserGame) return;
    const gameScene = phaserGame.scene.getScene('GameScene');
    if (gameScene && gameScene.scene.isActive()) {
      gameScene.scene.launch('PauseScene');
      gameScene.scene.pause();
    }
    gameState = 'paused';
    audioManager.onPause();
  },

  resume() {
    if (gameState !== 'paused' || !phaserGame) return;
    const pauseScene = phaserGame.scene.getScene('PauseScene');
    if (pauseScene) pauseScene.scene.stop();
    const gameScene = phaserGame.scene.getScene('GameScene');
    if (gameScene) gameScene.scene.resume();
    gameState = 'playing';
    audioManager.onResume();
  },

  restart() {
    if (!phaserGame) return;
    phaserGame.scene.stop('PauseScene');
    phaserGame.scene.stop('GameOverScene');
    phaserGame.scene.stop('IntroScene');
    phaserGame.scene.start('GameScene');
    gameState = 'playing';
  },

  renderIntroScreen() {
    if (!phaserGame) return;
    phaserGame.scene.start('IntroScene');
    gameState = 'intro';
  },

  renderPauseScreen() {
    if (!phaserGame) return;
    const gameScene = phaserGame.scene.getScene('GameScene');
    if (gameScene && gameScene.scene.isActive()) {
      gameScene.scene.launch('PauseScene');
      gameScene.scene.pause();
    }
    gameState = 'paused';
  },

  renderGameOverScreen(scoreResult) {
    if (!phaserGame) return;
    if (scoreResult && typeof scoreResult.score === 'number') {
      score = scoreResult.score;
    }
    phaserGame.scene.start('GameOverScene');
    gameState = 'gameover';
  },

  renderHUD() {
    if (!phaserGame) return;
    const gameScene = phaserGame.scene.getScene('GameScene');
    if (gameScene && typeof gameScene.renderHUD === 'function') {
      gameScene.renderHUD();
    }
  },

  getState() {
    return gameState;
  },

  getScore() {
    return {
      score: score,
      level: Math.floor((bpm - 100) / 5) + 1,
      timeElapsed: Math.floor(elapsedMs / 1000),
      customData: {
        combo: combo,
        maxCombo: maxCombo,
        health: health,
        bpm: bpm,
        accuracy: totalNotes > 0 ? ((perfectCount + greatCount + goodCount) / totalNotes * 100).toFixed(1) : '0.0',
        highScore: highScore
      }
    };
  }
};

window.game = window.SloppyGame;

window.triggerGameOver = function() {
  if (gameState === 'playing' && phaserGame) {
    if (score > highScore) highScore = score;
    gameState = 'gameover';
    phaserGame.scene.start('GameOverScene');
  }
};

// ── PostMessage command bridge ──────────────────────────────────────────
window.addEventListener('message', function(e) {
  if (!e.data || !e.data.type) return;
  var g = window.SloppyGame;
  switch (e.data.type) {
    case 'sloppy:command':
      var cmd = e.data.command;
      if (cmd === 'start' && g.start)     g.start();
      if (cmd === 'pause' && g.pause)     g.pause();
      if (cmd === 'resume' && g.resume)   g.resume();
      if (cmd === 'restart' && g.restart) g.restart();
      break;
    case 'sloppy:mute':
      if (typeof audioManager !== 'undefined') audioManager.mute();
      break;
    case 'sloppy:unmute':
      if (typeof audioManager !== 'undefined') audioManager.unmute();
      break;
  }
});

// ── Auto-init ───────────────────────────────────────────────────────────
(function boot() {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
    return;
  }
  window.SloppyGame.init(document.body, { container: document.body, width: W, height: H })
    .catch(function(err) {
      window.parent.postMessage({
        type: 'sloppy:game:error',
        message: err.message || 'init failed',
        stack: err.stack || ''
      }, '*');
    });
})();
</script>
