function createAudioManager(opts) {

    play: function(key) {

      if (p) { var a = [].concat(p); a[0] = (a[0] || 1) * ev(sfxVol); zzfx.apply(null, a); }

    playAmbient: function(src, loop) {
      if (typeof Howl !== 'function') return;

      if (!paused) ambientHowl.play();
    },
    stopAmbient: function() { if (ambientHowl) { ambientHowl.stop(); ambientHowl.unload(); ambientHowl = null; } },
    setMasterVolume: function(v) { masterVol = Math.max(0, Math.min(1, v)); },
    setMusicVolume: function(v) { musicVol = Math.max(0, Math.min(1, v)); },
    setSFXVolume: function(v) { sfxVol = Math.max(0, Math.min(1, v)); },

    onResume: function() { paused = false; if (ambientHowl && !muted) ambientHowl.play(); },
    onDestroy: function() { if (spriteHowl) { spriteHowl.unload(); spriteHowl = null; } mgr.stopAmbient(); window.removeEventListener('message', onMsg); },

// ── Helpers ──
function cellToWorld(row, col) {
  return {
    x: (col - GRID_SIZE / 2 + 0.5) * CELL_SIZE,
    z: (row - GRID_SIZE / 2 + 0.5) * CELL_SIZE
  };
}

function isWall(row, col) {
  if (!currentGrid) return true;
  if (row < 0 || row >= GRID_SIZE || col < 0 || col >= GRID_SIZE) return true;
  return currentGrid[row][col] === 1;
}

function updateHUD() {
  var le = document.getElementById('hud-level');
  var se = document.getElementById('hud-score');
  var te = document.getElementById('hud-timer');
  var fe = document.getElementById('hud-falls');
  if (le) le.textContent = 'Level ' + level;
  if (se) se.textContent = 'Score: ' + score;
  if (te) {
    var mins = Math.floor(levelTimer / 60);
    var secs = Math.floor(levelTimer % 60);
    te.textContent = mins + ':' + (secs < 10 ? '0' : '') + secs;
  }
  if (fe) {
    var remaining = maxFalls - falls;
    var dots = '';
    for (var i = 0; i < maxFalls; i++) {
      dots += i < remaining ? '\u25CF ' : '\u25CB ';
    }
    fe.textContent = dots;
  }
}

// ── Build / Clear Level ──
function clearLevel() {
  if (wallInstances) { boardGroup.remove(wallInstances); wallInstances = null; }
  for (var i = 0; i < holeMeshes.length; i++) boardGroup.remove(holeMeshes[i]);
  holeMeshes = [];
  holePositions = [];
  wallCells = [];
  if (goalMesh) { boardGroup.remove(goalMesh); goalMesh = null; }
  if (startMesh) { boardGroup.remove(startMesh); startMesh = null; }
  clearParticles();
}

function clearParticles() {
  for (var i = 0; i < celebrationParticles.length; i++) {
    boardGroup.remove(celebrationParticles[i].mesh);
    celebrationParticles[i].mesh.geometry.dispose();
    celebrationParticles[i].mesh.material.dispose();
  }
  celebrationParticles = [];
}

function buildLevel(idx) {
  clearLevel();
  currentGrid = LEVELS[idx];

  var wallCount = 0;
  for (var r = 0; r < GRID_SIZE; r++) {
    for (var c = 0; c < GRID_SIZE; c++) {
      if (currentGrid[r][c] === 1) wallCount++;
    }
  }

  // Walls (InstancedMesh)
  var wallGeo = new THREE.BoxGeometry(0.96, WALL_HEIGHT, 0.96);
  var wallMat = new THREE.MeshStandardMaterial({ color: 0x5c3a1e, roughness: 0.7, metalness: 0.05 });
  sharedGeos.push(wallGeo);
  sharedMats.push(wallMat);
  wallInstances = new THREE.InstancedMesh(wallGeo, wallMat, wallCount);
  wallInstances.castShadow = true;
  wallInstances.receiveShadow = true;

  var dummy = new THREE.Object3D();
  var idx2 = 0;
  for (var r = 0; r < GRID_SIZE; r++) {
    for (var c = 0; c < GRID_SIZE; c++) {
      var cellVal = currentGrid[r][c];
      var pos = cellToWorld(r, c);
      if (cellVal === 1) {
        dummy.position.set(pos.x, WALL_Y, pos.z);
        dummy.updateMatrix();
        wallInstances.setMatrixAt(idx2, dummy.matrix);
        var edgeness = (r === 0 || r === GRID_SIZE-1 || c === 0 || c === GRID_SIZE-1) ? 0 : 1;
        wallInstances.setColorAt(idx2, new THREE.Color(edgeness ? 0x6b432a : 0x4a2a12));
        idx2++;
        wallCells.push({ x: pos.x, z: pos.z });
      } else if (cellVal === 2) {
        // Hole
        var holeGeo = new THREE.CircleGeometry(HOLE_RADIUS, 32);
        var holeMat = new THREE.MeshStandardMaterial({ color: 0x080808, roughness: 1, metalness: 0 });
        var hole = new THREE.Mesh(holeGeo, holeMat);
        hole.rotation.x = -Math.PI / 2;
        hole.position.set(pos.x, BOARD_TOP + 0.005, pos.z);
        boardGroup.add(hole);
        holeMeshes.push(hole);
        holePositions.push({ x: pos.x, z: pos.z });
        // Hole ring
        var ringGeo = new THREE.RingGeometry(HOLE_RADIUS - 0.04, HOLE_RADIUS + 0.06, 32);
        var ringMat = new THREE.MeshStandardMaterial({ color: 0x220000, roughness: 0.5, emissive: 0x330000 });
        var ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = -Math.PI / 2;
        ring.position.set(pos.x, BOARD_TOP + 0.008, pos.z);
        boardGroup.add(ring);
        holeMeshes.push(ring);
      } else if (cellVal === 3) {
        startPosX = pos.x;
        startPosZ = pos.z;
        var sGeo = new THREE.BoxGeometry(0.8, 0.04, 0.8);
        var sMat = new THREE.MeshStandardMaterial({ color: 0x3388ff, emissive: 0x1144aa, emissiveIntensity: 0.4, roughness: 0.5 });
        startMesh = new THREE.Mesh(sGeo, sMat);
        startMesh.position.set(pos.x, BOARD_TOP + 0.02, pos.z);
        startMesh.receiveShadow = true;
        boardGroup.add(startMesh);
      } else if (cellVal === 4) {
        goalPosX = pos.x;
        goalPosZ = pos.z;
        var gGeo = new THREE.BoxGeometry(0.8, 0.04, 0.8);
        var gMat = new THREE.MeshStandardMaterial({ color: 0x00cc44, emissive: 0x00aa33, emissiveIntensity: 0.5, roughness: 0.4 });
        goalMesh = new THREE.Mesh(gGeo, gMat);
        goalMesh.position.set(pos.x, BOARD_TOP + 0.02, pos.z);
        goalMesh.receiveShadow = true;
        boardGroup.add(goalMesh);
      }
    }
  }
  wallInstances.instanceMatrix.needsUpdate = true;
  if (wallInstances.instanceColor) wallInstances.instanceColor.needsUpdate = true;
  boardGroup.add(wallInstances);
}

function resetMarble() {
  marblePosX = startPosX;
  marblePosZ = startPosZ;
  marbleVelX = 0;
  marbleVelZ = 0;
  tiltX = 0;
  tiltZ = 0;
  targetTiltX = 0;
  targetTiltZ = 0;
  marbleRotX = 0;
  marbleRotZ = 0;
  subState = null;
  subStateTimer = 0;
  if (marbleMesh) {
    marbleMesh.position.set(marblePosX, MARBLE_Y, marblePosZ);
    marbleMesh.scale.setScalar(1);
    marbleMesh.visible = true;
  }
}

function startPlaying() {
  introEl.style.display = 'none';
  pauseEl.style.display = 'none';
  gameOverEl.style.display = 'none';
  hudEl.style.display = 'block';
  score = 0;
  level = 1;
  falls = 0;
  firstTry = true;
  levelTimer = 0;
  totalTime = 0;
  buildLevel(0);
  resetMarble();
  gameState = 'playing';
  clock.getDelta();
}

// ── Physics ──
function resolveOneWall(mx, mz, wx, wz) {
  var hw = CELL_SIZE * 0.5;
  var cx = Math.max(wx - hw, Math.min(mx, wx + hw));
  var cz = Math.max(wz - hw, Math.min(mz, wz + hw));
  var dx = mx - cx;
  var dz = mz - cz;
  var dist2 = dx * dx + dz * dz;
  var mr = MARBLE_RADIUS;
  if (dist2 < mr * mr && dist2 > 0.0001) {
    var dist = Math.sqrt(dist2);
    var nx = dx / dist;
    var nz = dz / dist;
    var pen = mr - dist;
    mx += nx * pen;
    mz += nz * pen;
    var dot = marbleVelX * nx + marbleVelZ * nz;
    if (dot < 0) {
      marbleVelX -= (1 + BOUNCE) * dot * nx;
      marbleVelZ -= (1 + BOUNCE) * dot * nz;
      marbleVelX *= 0.85;
      marbleVelZ *= 0.85;
      if (wallHitCooldown <= 0) {
        audioManager.play('wallHit');
        wallHitCooldown = 0.12;
      }
    }
    return { x: mx, z: mz, hit: true };
  }
  return { x: mx, z: mz, hit: false };
}

function updatePhysics(dt) {
  if (subState) return;

  // Input → target tilt
  var wantLeft = keysDown['ArrowLeft'] || keysDown['KeyA'];
  var wantRight = keysDown['ArrowRight'] || keysDown['KeyD'];
  var wantUp = keysDown['ArrowUp'] || keysDown['KeyW'];
  var wantDown = keysDown['ArrowDown'] || keysDown['KeyS'];

  targetTiltX = 0;
  targetTiltZ = 0;
  if (wantRight) targetTiltX = MAX_TILT;
  if (wantLeft) targetTiltX = -MAX_TILT;
  if (wantDown) targetTiltZ = MAX_TILT;
  if (wantUp) targetTiltZ = -MAX_TILT;

  // Lerp tilt
  var tiltDt = dt * (targetTiltX !== 0 || targetTiltZ !== 0 ? TILT_SPEED : TILT_RETURN);
  tiltX += (targetTiltX - tiltX) * Math.min(1, tiltDt);
  tiltZ += (targetTiltZ - tiltZ) * Math.min(1, tiltDt);

  // Sub-stepped physics
  var subDt = dt / SUBSTEPS;
  for (var step = 0; step < SUBSTEPS; step++) {
    // Acceleration from tilt
    var ax = GRAVITY * Math.sin(tiltX);
    var az = GRAVITY * Math.sin(tiltZ);
    marbleVelX += ax * subDt;
    marbleVelZ += az * subDt;

    // Friction
    var fric = Math.pow(FRICTION, subDt * 60);
    marbleVelX *= fric;
    marbleVelZ *= fric;

    // Clamp velocity
    var speed = Math.sqrt(marbleVelX * marbleVelX + marbleVelZ * marbleVelZ);
    if (speed > MAX_VEL) {
      marbleVelX *= MAX_VEL / speed;
      marbleVelZ *= MAX_VEL / speed;
    }

    // Move
    marblePosX += marbleVelX * subDt;
    marblePosZ += marbleVelZ * subDt;

    // Wall collision (check nearby cells)
    var cr = Math.floor(marblePosZ / CELL_SIZE + GRID_SIZE / 2);
    var cc = Math.floor(marblePosX / CELL_SIZE + GRID_SIZE / 2);
    for (var dr = -1; dr <= 1; dr++) {
      for (var dc = -1; dc <= 1; dc++) {
        var wr = cr + dr;
        var wc = cc + dc;
        if (isWall(wr, wc)) {
          var wp = cellToWorld(wr, wc);
          var res = resolveOneWall(marblePosX, marblePosZ, wp.x, wp.z);
          marblePosX = res.x;
          marblePosZ = res.z;
        }
      }
    }
  }

  // Check holes
  for (var h = 0; h < holePositions.length; h++) {
    var hp = holePositions[h];
    var hdx = marblePosX - hp.x;
    var hdz = marblePosZ - hp.z;
    var hdist = Math.sqrt(hdx * hdx + hdz * hdz);
    if (hdist < HOLE_RADIUS * 0.65) {
      subState = 'falling';
      subStateTimer = 0;
      fallingHoleX = hp.x;
      fallingHoleZ = hp.z;
      audioManager.play('fall');
      return;
    }
  }

  // Check goal
  var gdx = marblePosX - goalPosX;
  var gdz = marblePosZ - goalPosZ;
  if (Math.abs(gdx) < 0.4 && Math.abs(gdz) < 0.4) {
    subState = 'celebrating';
    subStateTimer = 0;
    var levelScore = 1000 - Math.floor(levelTimer) * 5;
    if (levelScore < 100) levelScore = 100;
    if (firstTry) levelScore += 500;
    score += levelScore;
    audioManager.play('goalReach');
    createCelebrationParticles(goalPosX, goalPosZ);
    return;
  }

  // Update marble position
  marbleMesh.position.x = marblePosX;
  marbleMesh.position.z = marblePosZ;
  marbleMesh.position.y = MARBLE_Y;

  // Rolling rotation
  marbleRotZ -= marbleVelX * dt / MARBLE_RADIUS;
  marbleRotX += marbleVelZ * dt / MARBLE_RADIUS;
  marbleMesh.rotation.set(marbleRotX, 0, marbleRotZ);

  // Timer
  levelTimer += dt;
  totalTime += dt;
  wallHitCooldown -= dt;
}

function updateFalling(dt) {
  subStateTimer += dt;
  var t = Math.min(subStateTimer / 0.55, 1);
  var eased = t * t;
  marbleMesh.position.x += (fallingHoleX - marbleMesh.position.x) * 0.15;
  marbleMesh.position.z += (fallingHoleZ - marbleMesh.position.z) * 0.15;
  marbleMesh.position.y = MARBLE_Y - eased * 2.5;
  marbleMesh.scale.setScalar(1 - eased * 0.85);
  if (t >= 1) {
    falls++;
    if (falls >= maxFalls) {
      endGame();
    } else {
      score = Math.max(0, score - 100);
      firstTry = false;
      resetMarble();
      audioManager.play('resetSfx');
    }
  }
}

function updateCelebrating(dt) {
  subStateTimer += dt;
  updateParticles(dt);
  // Spin and lift marble
  marbleMesh.position.y = MARBLE_Y + Math.sin(subStateTimer * 6) * 0.3;
  marbleMesh.rotation.y += dt * 8;
  if (subStateTimer > 1.2) {
    if (level >= LEVELS.length) {
      // All levels complete!
      endGame(true);
    } else {
      level++;
      falls = 0;
      firstTry = true;
      levelTimer = 0;
      audioManager.play('levelUp');
      buildLevel(level - 1);
      resetMarble();
    }
  }
}

function createCelebrationParticles(x, z) {
  for (var i = 0; i < 24; i++) {
    var geo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
    var hue = Math.random();
    var col = new THREE.Color().setHSL(hue, 0.9, 0.55);
    var mat = new THREE.MeshStandardMaterial({ color: col, emissive: col.clone().multiplyScalar(0.4), roughness: 0.5 });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, MARBLE_Y + 0.3, z);
    var angle = Math.random() * Math.PI * 2;
    var spd = 2 + Math.random() * 4;
    boardGroup.add(mesh);
    celebrationParticles.push({
      mesh: mesh,
      vx: Math.cos(angle) * spd,
      vy: 3 + Math.random() * 4,
      vz: Math.sin(angle) * spd,
      life: 1.2 + Math.random() * 0.5
    });
  }
}

function updateParticles(dt) {
  for (var i = celebrationParticles.length - 1; i >= 0; i--) {
    var p = celebrationParticles[i];
    p.life -= dt;
    p.vy -= 12 * dt;
    p.mesh.position.x += p.vx * dt;
    p.mesh.position.y += p.vy * dt;
    p.mesh.position.z += p.vz * dt;
    p.mesh.rotation.x += dt * 5;
    p.mesh.rotation.z += dt * 3;
    var s = Math.max(0, p.life / 1.5);
    p.mesh.scale.setScalar(s);
    if (p.life <= 0) {
      boardGroup.remove(p.mesh);
      p.mesh.geometry.dispose();
      p.mesh.material.dispose();
      celebrationParticles.splice(i, 1);
    }
  }
}

function endGame(won) {
  if (score > highScore) highScore = score;
  if (level > bestLevel) bestLevel = level;
  gameState = 'gameover';
  subState = null;
  audioManager.play(won ? 'celebrate' : 'gameOver');
  hudEl.style.display = 'none';
  gameOverEl.style.display = 'flex';
  var titleEl = document.getElementById('go-title');
  var statsEl = document.getElementById('go-stats');
  if (titleEl) titleEl.textContent = won ? 'MAZE MASTERED!' : 'FALLEN';
  if (statsEl) {
    var lines = '';
    if (won) lines += 'All ' + LEVELS.length + ' levels complete!<br>';
    lines += 'Level reached: ' + level + '<br>';
    lines += 'Score: ' + score + '<br>';
    lines += 'Time: ' + formatTime(totalTime) + '<br>';
    if (score >= highScore && score > 0) lines += '<span style="color:#ffd700;">\u2605 NEW HIGH SCORE! \u2605</span><br>';
    lines += 'High Score: ' + highScore;
    statsEl.innerHTML = lines;
  }
}

function formatTime(t) {
  var m = Math.floor(t / 60);
  var s = Math.floor(t % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

// ── Input Handlers ──
function setupInput() {
  window.addEventListener('keydown', function(e) {
    keysDown[e.code] = true;
    if (e.code === 'Escape') {
      e.preventDefault();
      if (gameState === 'playing' && !subState) window.SloppyGame.pause();
      else if (gameState === 'paused') window.SloppyGame.resume();
    }
    if (e.code === 'KeyR' && gameState === 'playing' && !subState) {
      score = Math.max(0, score - 100);
      firstTry = false;
      resetMarble();
      audioManager.play('resetSfx');
    }
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code) >= 0) e.preventDefault();
  });
  window.addEventListener('keyup', function(e) {
    keysDown[e.code] = false;
  });
}

// ── Animation Loop ──
function animate() {
  animationId = requestAnimationFrame(animate);
  var dt = Math.min(clock.getDelta(), 0.05);

  if (gameState === 'playing') {
    if (subState === 'falling') {
      updateFalling(dt);
    } else if (subState === 'celebrating') {
      updateCelebrating(dt);
    } else {
      updatePhysics(dt);
    }
    updateHUD();
    // Board visual tilt
    boardGroup.rotation.z = -tiltX;
    boardGroup.rotation.x = tiltZ;
    // Goal pulse
    if (goalMesh) {
      var pulse = 0.3 + Math.sin(Date.now() * 0.005) * 0.2;
      goalMesh.material.emissiveIntensity = pulse;
    }
  } else if (gameState === 'intro') {
    // Gentle idle tilt
    introTiltTimer += dt;
    boardGroup.rotation.z = Math.sin(introTiltTimer * 0.8) * 0.04;
    boardGroup.rotation.x = Math.cos(introTiltTimer * 0.6) * 0.03;
  }

  renderer.render(scene, camera);
}

// ── SloppyGame SDK ──
window.SloppyGame = {
  async init(cont, config) {
    container = cont;
    container.style.position = 'relative';
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(config.width || W, config.height || H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd4956b);

    camera = new THREE.PerspectiveCamera(40, (config.width || W) / (config.height || H), 0.1, 100);
    camera.position.set(0, 18, 2);
    camera.lookAt(0, 0, 1.5);

    // Lights
    scene.add(new THREE.AmbientLight(0xffeedd, 0.45));
    scene.add(new THREE.HemisphereLight(0xffd4a0, 0x604030, 0.35));

    dirLight = new THREE.DirectionalLight(0xfff5e0, 1.1);
    dirLight.position.set(5, 12, 6);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.left = -8;
    dirLight.shadow.camera.right = 8;
    dirLight.shadow.camera.top = 8;
    dirLight.shadow.camera.bottom = -8;
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 30;
    dirLight.shadow.bias = -0.002;
    dirLight.target.position.set(0, 0, 0);
    scene.add(dirLight);
    scene.add(dirLight.target);

    // Board group
    boardGroup = new THREE.Group();
    scene.add(boardGroup);

    // Board mesh
    var boardGeo = new THREE.BoxGeometry(GRID_SIZE, BOARD_HEIGHT, GRID_SIZE);
    var boardMat = new THREE.MeshStandardMaterial({ color: 0xb8885a, roughness: 0.6, metalness: 0.05 });
    sharedGeos.push(boardGeo);
    sharedMats.push(boardMat);
    boardMesh = new THREE.Mesh(boardGeo, boardMat);
    boardMesh.receiveShadow = true;
    boardMesh.castShadow = true;
    boardGroup.add(boardMesh);

    // Board bottom edge (darker underside visible when tilted)
    var edgeGeo = new THREE.BoxGeometry(GRID_SIZE + 0.2, 0.1, GRID_SIZE + 0.2);
    var edgeMat = new THREE.MeshStandardMaterial({ color: 0x6b4228, roughness: 0.8 });
    sharedGeos.push(edgeGeo);
    sharedMats.push(edgeMat);
    var edge = new THREE.Mesh(edgeGeo, edgeMat);
    edge.position.y = -BOARD_HEIGHT / 2 - 0.05;
    boardGroup.add(edge);

    // Marble
    var marbleGeo = new THREE.SphereGeometry(MARBLE_RADIUS, 32, 32);
    var marbleMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 1.0, roughness: 0.1 });
    sharedGeos.push(marbleGeo);
    sharedMats.push(marbleMat);
    marbleMesh = new THREE.Mesh(marbleGeo, marbleMat);
    marbleMesh.castShadow = true;
    boardGroup.add(marbleMesh);

    clock = new THREE.Clock();
    createOverlays();
    setupInput();
    buildLevel(0);
    resetMarble();
    animate();

    gameState = 'intro';
    introEl.style.display = 'flex';
    window.parent.postMessage({ type: 'sloppy:game:ready' }, '*');
  },

  destroy: function() {
    if (animationId) cancelAnimationFrame(animationId);
    clearLevel();
    for (var i = 0; i < sharedGeos.length; i++) sharedGeos[i].dispose();
    for (var i = 0; i < sharedMats.length; i++) sharedMats[i].dispose();
    sharedGeos = [];
    sharedMats = [];
    if (scene) scene.traverse(function(obj) {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        if (Array.isArray(obj.material)) obj.material.forEach(function(m){ m.dispose(); });
        else obj.material.dispose();
      }
    });
    if (renderer) {
      renderer.dispose();
      if (renderer.domElement && renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
    }
    [hudEl, introEl, pauseEl, gameOverEl].forEach(function(el) {
      if (el && el.parentNode) el.parentNode.removeChild(el);
    });
    audioManager.onDestroy();
    gameState = 'idle';
  },

  start: function() {
    gameState = 'intro';
    introEl.style.display = 'flex';
    hudEl.style.display = 'none';
    pauseEl.style.display = 'none';
    gameOverEl.style.display = 'none';
    var hsEl = document.getElementById('intro-hs');
    if (hsEl) hsEl.innerHTML = bestLevel > 0 ? 'Best Level: ' + bestLevel + ' | High Score: ' + highScore : '';
  },

  pause: function() {
    if (gameState !== 'playing') return;
    audioManager.play('uiSelect');
    gameState = 'paused';
    pauseEl.style.display = 'flex';
    audioManager.onPause();
  },

  resume: function() {
    if (gameState !== 'paused') return;
    gameState = 'playing';
    pauseEl.style.display = 'none';
    clock.getDelta();
    audioManager.onResume();
    audioManager.play('uiSelect');
  },

  restart: function() {
    pauseEl.style.display = 'none';
    gameOverEl.style.display = 'none';
    introEl.style.display = 'none';
    hudEl.style.display = 'block';
    score = 0;
    level = 1;
    falls = 0;
    firstTry = true;
    levelTimer = 0;
    totalTime = 0;
    subState = null;
    subStateTimer = 0;
    buildLevel(0);
    resetMarble();
    gameState = 'playing';
    clock.getDelta();
  },

  renderIntroScreen: function() {
    gameState = 'intro';
    hudEl.style.display = 'none';
    pauseEl.style.display = 'none';
    gameOverEl.style.display = 'none';
    introEl.style.display = 'flex';
  },

  renderPauseScreen: function() {
    if (gameState === 'playing') {
      gameState = 'paused';
      pauseEl.style.display = 'flex';
    }
  },

  renderGameOverScreen: function(scoreResult) {
    if (scoreResult && typeof scoreResult.score === 'number') score = scoreResult.score;
    endGame();
  },

  renderHUD: function() { updateHUD(); },

  getState: function() { return gameState; },

  getScore: function() {
    return {
      score: score,
      level: level,
      timeElapsed: Math.floor(totalTime),
      customData: { falls: falls, highScore: highScore, bestLevel: bestLevel, firstTry: firstTry }
    };
  },

  metadata: {
    title: 'Gravity Maze',
    genre: '3d-custom',
    engine: 'threejs',
    supportsMultiplayer: false,
    controls: [
      { key: 'Arrow Keys / WASD', action: 'Tilt board' },
      { key: 'R', action: 'Reset current level' },
      { key: 'Escape', action: 'Pause' }
    ],
    estimatedPlayTime: '3-10 min'
  },
  supportsMultiplayer: false
};

window.game = window.SloppyGame;

window.triggerGameOver = function() {
  if (gameState === 'playing') endGame();
};

window.addEventListener('message', function(e) {
  if (!e.data || !e.data.type) return;
  var g = window.SloppyGame;
  switch (e.data.type) {
    case 'sloppy:command':
      var cmd = e.data.command;
      if (cmd === 'start' && g.start) g.start();
      if (cmd === 'pause' && g.pause) g.pause();
      if (cmd === 'resume' && g.resume) g.resume();
      if (cmd === 'restart' && g.restart) g.restart();
      break;
    case 'sloppy:mute':
      if (typeof audioManager !== 'undefined') audioManager.mute();
      break;
    case 'sloppy:unmute':
      if (typeof audioManager !== 'undefined') audioManager.unmute();
      break;
  }
});

(function boot() {
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', boot); return; }
  window.SloppyGame.init(document.body, { container: document.body, width: W, height: H })
    .catch(function(err) {
      window.parent.postMessage({ type: 'sloppy:game:error', message: err.message || 'init failed', stack: err.stack || '' }, '*');
    });
})();
</script>
</body>
