<body>
<script>
/*
 * Chain of Thought — Plasma Blitz (2d-shooter, Phaser 3)
 * 1. BootScene: Generate all procedural textures (ship, bullets, enemies, boss, power-ups, particles, stars).
 * 2. IntroScene: Animated title, parallax stars, controls prompt, high score.
 * 3. GameScene: Vertical shmup — player bottom 60%, auto-fire, wave system, enemy patterns,
 *    power-ups, weapon upgrades (single→spread→laser), bombs, combo, boss every 5 waves.
 * 4. PauseScene: Dark overlay with score + wave info.
 * 5. GameOverScene: Dramatic reveal, stats, high score celebration.
 * 6. SDK v2 adapter: All 12 methods, metadata, postMessage bridge, auto-init.
 */

let zzfxCtx;
function zzfx(v=1,r=.05,f=220,a=0,s=0,rl=.1,sh=0,sc=1,sl=0,ds=0,pj=0,pjt=0,rt=0,n=0,m=0,bc=0,dl=0,sv=1,dc=0,tr=0){
if(!zzfxCtx)zzfxCtx=new AudioContext();
const sr=zzfxCtx.sampleRate,P=Math.PI*2;
let S=sl*=500*P/sr/sr,F=f*=(1+r*2*Math.random()-r)*P/sr,b=[],t=0,tm=0,i=0,j=1,R=0,c=0,e,L;
a=a*sr+9;dc=dc*sr;s=s*sr;rl=rl*sr;dl=dl*sr;L=a+dc+s+rl+dl|0;
for(;i<L;i++){if(i<a)R=i/a;else if(i<a+dc)R=1+((i-a)/dc)*(sv-1);else if(i<a+dc+s)R=sv;else R=sv*(1-(i-a-dc-s)/rl);
if(dl&&i>L-dl)R*=(L-i)/dl;f+=sl+=ds;if(pj&&!(++c%(pjt*100|0))){f+=pj;F+=pj}
if(rt&&!(++j%(rt*100|0))){f=F;sl=S}t+=f;tm+=f*Math.abs(m);
e=t;if(sh===1)e=e%P>P/2?1:-1;else if(sh===2)e=Math.sin(e*e);else if(sh===3){e=((e%P)/P*2-1);e=(e>0?1:-1)*Math.pow(Math.abs(e),sc)}else if(sh===4)e=Math.sin(e)*Math.sin(e*.5);else e=Math.sin(e);
e*=(n?Math.random()*n:1)*R*v*.3;if(m)e*=1+Math.sin(tm)*m;if(bc)e=Math.round(e*bc)/bc;if(tr)e*=1-tr+tr*Math.sin(P*i/sr*8);b.push(e)}
if(!b.length)return;const buf=zzfxCtx.createBuffer(1,b.length,sr),d=buf.getChannelData(0);for(let k=0;k<b.length;k++)d[k]=b[k];
const nd=zzfxCtx.createBufferSource();nd.buffer=buf;nd.connect(zzfxCtx.destination);nd.start();return nd}

const SFX = {
  shoot:     [,,90,.01,.03,.02,4,2,,,,,,,4],
  shootSpread: [.6,,120,.01,.04,.03,4,1.8,,,,,,,3],
  laser:     [.4,,440,.01,.08,.04,2,1.2,,5,,,,3],
  hit:       [1,.1,480,.03,.1,.02,1,.5,,,,,,.5],
  explosion: [2,.1,130,.01,.6,.5,4,.1,,30,,,,.5,-5],
  enemyShoot:[.5,,180,.01,.02,.03,4,1.5,,,,,,,2],
  coin:      [,,537,.02,.02,.22,1,1.59,-6.98,4.97],
  powerUp:   [,,660,,.1,.3,1,1.8,,7,,,.09],
  select:    [,,440,,.03,.03,1,2,,,100,.03],
  confirm:   [,,660,,.05,.1,1,1.5],
  bomb:      [2,.2,60,.02,.8,.6,4,.3,,20,,,,.8,-3],
  levelUp:   [1.5,.8,270,,.1,,1,1.5,,,,,,.1,.01],
  gameOver:  [,,925,.04,.3,.6,1,.3,,6.27,-184,.09,.17],
  impact:    [2,,100,.01,.1,.2,4,1.5,,,-200,.1,,2],
  shield:    [.8,,330,,.08,.15,1,1.3,,4,,,.06],
  bossAlert: [1,.1,200,.05,.2,.3,2,1,,,-50,.05,.1,1]
};

function createAudioManager(opts) {
  opts = opts || {};
  let masterVol = 1, musicVol = 0.5, sfxVol = 0.8, muted = false, paused = false;
  let spriteHowl = null, ambientHowl = null, notified = false;
  const useHowler = !!(opts.spriteSrc && opts.spriteSrc.length && typeof Howl === 'function');
  if (useHowler) spriteHowl = new Howl({ src: opts.spriteSrc, sprite: opts.spriteMap || {}, volume: sfxVol });
  function ev(base) { return muted ? 0 : base * masterVol; }
  function notifyParent() { if (notified) return; notified = true; try { if (window.parent !== window) window.parent.postMessage({ type: 'sloppy:audio-started' }, '*'); } catch(e){} }
  const mgr = {
    play(key) {
      if (muted || paused) return;
      notifyParent();
      if (useHowler && spriteHowl) { spriteHowl.volume(ev(sfxVol)); spriteHowl.play(key); return; }
      const p = typeof SFX !== 'undefined' && SFX[key];
      if (p) { const a = [...p]; a[0] = (a[0] || 1) * ev(sfxVol); zzfx(...a); }
    },
    playAmbient(src, loop) {
      if (typeof Howl !== 'function') return;
      mgr.stopAmbient();
      notifyParent();
      ambientHowl = new Howl({ src: [src], loop: loop !== false, volume: ev(musicVol) });
      if (!paused) ambientHowl.play();
    },
    stopAmbient() { if (ambientHowl) { ambientHowl.stop(); ambientHowl.unload(); ambientHowl = null; } },
    setMasterVolume(v) { masterVol = Math.max(0, Math.min(1, v)); },
    setMusicVolume(v) { musicVol = Math.max(0, Math.min(1, v)); },
    setSFXVolume(v) { sfxVol = Math.max(0, Math.min(1, v)); },
    onPause() { paused = true; if (spriteHowl) spriteHowl.pause(); if (ambientHowl) ambientHowl.pause(); },
    onResume() { paused = false; if (ambientHowl && !muted) ambientHowl.play(); },
    onDestroy() { if (spriteHowl) { spriteHowl.unload(); spriteHowl = null; } mgr.stopAmbient(); window.removeEventListener('message', onMsg); },
    mute() { muted = true; if (typeof Howler !== 'undefined') Howler.mute(true); },
    unmute() { muted = false; if (typeof Howler !== 'undefined') Howler.mute(false); }
  };
  function onMsg(e) { if (e.data && e.data.type === 'sloppy:mute') mgr.mute(); if (e.data && e.data.type === 'sloppy:unmute') mgr.unmute(); }
  window.addEventListener('message', onMsg);
  return mgr;
}

const audioManager = createAudioManager();

// ── Constants ──
const W = 960, H = 540;
const PLAYER_SPEED = 280;
const MOVE_BOUNDS_Y = H * 0.4; // player restricted to bottom 60%

let gameState = 'idle';
let score = 0;
let displayScore = 0;
let highScore = 0;
let wave = 1;
let weaponLevel = 1; // 1=single, 2=spread, 3=laser
let bombs = 1;
let hasShield = false;
let combo = 0;
let comboTimer = 0;
let maxCombo = 0;
let enemiesDestroyed = 0;
let survivalMs = 0;
let phaserGame = null;

// Wave definitions — each wave is an array of spawn entries
function generateWaveData(waveNum) {
  const entries = [];
  const count = Math.min(6 + Math.floor(waveNum * 1.5), 30);
  const isBoss = waveNum % 5 === 0;
  const isMiniBoss = waveNum % 5 === 0 ? false : waveNum >= 5 && waveNum % 3 === 0;

  if (isBoss) {
    entries.push({ type: 'boss', x: W / 2, delay: 500, pattern: 'straight' });
    for (let i = 0; i < 4; i++) {
      entries.push({ type: 'basic', x: 100 + i * 200, delay: 2000 + i * 400, pattern: 'straight' });
    }
    return entries;
  }

  for (let i = 0; i < count; i++) {
    const x = 60 + Math.random() * (W - 120);
    const delay = i * Math.max(300, 800 - waveNum * 30);
    let type = 'basic';
    let pattern = 'straight';

    if (waveNum >= 3 && Math.random() < 0.3 + waveNum * 0.02) {
      type = 'shooter';
    }
    if (isMiniBoss && i === Math.floor(count / 2)) {
      type = 'miniboss';
    }
    if (waveNum >= 3 && Math.random() < 0.4) {
      pattern = Math.random() < 0.5 ? 'sine' : 'diagonal';
    }

    entries.push({ type, x, delay, pattern });
  }
  return entries;
}

// ── BootScene ──
class BootScene extends Phaser.Scene {
  constructor() { super('BootScene'); }

  create() {
    const g = this.add.graphics();

    // Player ship — green triangle pointing up
    g.fillStyle(0x00ff66);
    g.beginPath();
    g.moveTo(12, 0); g.lineTo(0, 20); g.lineTo(12, 15); g.lineTo(24, 20);
    g.closePath(); g.fillPath();
    g.lineStyle(1, 0x88ffaa);
    g.beginPath();
    g.moveTo(12, 0); g.lineTo(0, 20); g.lineTo(12, 15); g.lineTo(24, 20);
    g.closePath(); g.strokePath();
    g.generateTexture('player', 24, 20);
    g.clear();

    // Player bullet
    g.fillStyle(0x00ff66);
    g.fillRect(0, 0, 4, 8);
    g.generateTexture('bullet', 4, 8);
    g.clear();

    // Enemy bullet
    g.fillStyle(0xff4444);
    g.fillCircle(3, 3, 3);
    g.generateTexture('enemyBullet', 6, 6);
    g.clear();

    // Basic enemy — red diamond
    g.fillStyle(0xff3333);
    g.beginPath();
    g.moveTo(8, 0); g.lineTo(16, 8); g.lineTo(8, 16); g.lineTo(0, 8);
    g.closePath(); g.fillPath();
    g.lineStyle(1, 0xff8888);
    g.beginPath();
    g.moveTo(8, 0); g.lineTo(16, 8); g.lineTo(8, 16); g.lineTo(0, 8);
    g.closePath(); g.strokePath();
    g.generateTexture('enemyBasic', 16, 16);
    g.clear();

    // Shooter enemy — orange hexagon
    g.fillStyle(0xff8800);
    const hx = 9, hy = 8, hr = 8;
    g.beginPath();
    for (let i = 0; i < 6; i++) {
      const angle = Math.PI / 6 + (Math.PI * 2 / 6) * i;
      const px = hx + Math.cos(angle) * hr;
      const py = hy + Math.sin(angle) * hr;
      if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.closePath(); g.fillPath();
    g.lineStyle(1, 0xffbb44);
    g.beginPath();
    for (let i = 0; i < 6; i++) {
      const angle = Math.PI / 6 + (Math.PI * 2 / 6) * i;
      const px = hx + Math.cos(angle) * hr;
      const py = hy + Math.sin(angle) * hr;
      if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.closePath(); g.strokePath();
    g.generateTexture('enemyShooter', 18, 16);
    g.clear();

    // Mini-boss — purple circle
    g.fillStyle(0xaa44ff);
    g.fillCircle(14, 14, 14);
    g.lineStyle(2, 0xcc88ff);
    g.strokeCircle(14, 14, 14);
    g.generateTexture('enemyMiniBoss', 28, 28);
    g.clear();

    // Boss — large red/purple shape
    g.fillStyle(0x8800cc);
    g.fillRect(0, 4, 48, 24);
    g.fillStyle(0xaa22ee);
    g.fillTriangle(0, 4, -8, 16, 0, 28);
    g.fillTriangle(48, 4, 56, 16, 48, 28);
    g.fillStyle(0xff2244);
    g.fillCircle(16, 16, 6);
    g.fillCircle(32, 16, 6);
    g.lineStyle(2, 0xcc66ff);
    g.strokeRect(0, 4, 48, 24);
    g.generateTexture('boss', 56, 32);
    g.clear();

    // Power-up weapon (cyan diamond)
    g.fillStyle(0x00ccff);
    g.beginPath();
    g.moveTo(8, 0); g.lineTo(16, 8); g.lineTo(8, 16); g.lineTo(0, 8);
    g.closePath(); g.fillPath();
    g.generateTexture('puWeapon', 16, 16);
    g.clear();

    // Power-up shield (blue circle)
    g.fillStyle(0x4488ff);
    g.fillCircle(8, 8, 8);
    g.lineStyle(2, 0x88bbff);
    g.strokeCircle(8, 8, 8);
    g.generateTexture('puShield', 16, 16);
    g.clear();

    // Power-up bomb (red square)
    g.fillStyle(0xff4444);
    g.fillRect(2, 2, 12, 12);
    g.lineStyle(1, 0xff8888);
    g.strokeRect(2, 2, 12, 12);
    g.generateTexture('puBomb', 16, 16);
    g.clear();

    // Particle textures
    g.fillStyle(0x00ff66);
    g.fillCircle(3, 3, 3);
    g.generateTexture('particleGreen', 6, 6);
    g.clear();

    g.fillStyle(0xff4444);
    g.fillCircle(3, 3, 3);
    g.generateTexture('particleRed', 6, 6);
    g.clear();

    g.fillStyle(0xff8800);
    g.fillCircle(3, 3, 3);
    g.generateTexture('particleOrange', 6, 6);
    g.clear();

    g.fillStyle(0xffcc00);
    g.fillCircle(3, 3, 3);
    g.generateTexture('particleGold', 6, 6);
    g.clear();

    g.fillStyle(0xaa44ff);
    g.fillCircle(3, 3, 3);
    g.generateTexture('particlePurple', 6, 6);
    g.clear();

    g.fillStyle(0x00ccff);
    g.fillCircle(3, 3, 3);
    g.generateTexture('particleCyan', 6, 6);
    g.clear();

    g.fillStyle(0xffffff);
    g.fillCircle(2, 2, 2);
    g.generateTexture('star', 4, 4);
    g.clear();

    // Shield aura
    g.lineStyle(2, 0x4488ff, 0.6);
    g.strokeCircle(16, 16, 16);
    g.generateTexture('shieldAura', 32, 32);
    g.clear();

    // Boss health bar bg
    g.fillStyle(0x333333);
    g.fillRect(0, 0, 52, 6);
    g.generateTexture('hpBarBg', 52, 6);
    g.clear();

    // Boss health bar fill
    g.fillStyle(0xff2244);
    g.fillRect(0, 0, 50, 4);
    g.generateTexture('hpBarFill', 50, 4);
    g.clear();

    // Laser beam segment
    g.fillStyle(0x00ff66);
    g.fillRect(0, 0, 6, 8);
    g.generateTexture('laserSeg', 6, 8);
    g.clear();

    g.destroy();
    this.scene.start('IntroScene');
  }
}

// ── IntroScene ──
class IntroScene extends Phaser.Scene {
  constructor() { super('IntroScene'); }

  create() {
    this.cameras.main.setBackgroundColor('#050520');

    this.starLayer1 = [];
    this.starLayer2 = [];
    for (let i = 0; i < 60; i++) {
      const s = this.add.image(Phaser.Math.Between(0, W), Phaser.Math.Between(0, H), 'star');
      s.setAlpha(Phaser.Math.FloatBetween(0.1, 0.3));
      s.setScale(Phaser.Math.FloatBetween(0.3, 0.6));
      s.speed = Phaser.Math.FloatBetween(0.2, 0.5);
      this.starLayer1.push(s);
    }
    for (let i = 0; i < 40; i++) {
      const s = this.add.image(Phaser.Math.Between(0, W), Phaser.Math.Between(0, H), 'star');
      s.setAlpha(Phaser.Math.FloatBetween(0.3, 0.7));
      s.setScale(Phaser.Math.FloatBetween(0.6, 1.2));
      s.speed = Phaser.Math.FloatBetween(0.6, 1.5);
      this.starLayer2.push(s);
    }

    const title = this.add.text(W / 2, H * 0.28, 'PLASMA BLITZ', {
      fontFamily: 'monospace', fontSize: '52px', fontStyle: 'bold',
      color: '#00ff66', stroke: '#003311', strokeThickness: 4
    }).setOrigin(0.5);
    title.setShadow(3, 3, '#00ff66', 14, true, true);

    this.tweens.add({
      targets: title, scaleX: 1.06, scaleY: 1.06, duration: 1000,
      yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
    });

    this.add.text(W / 2, H * 0.42, 'Survive the alien onslaught. Upgrade weapons. Destroy everything.', {
      fontFamily: 'monospace', fontSize: '13px', color: '#448866'
    }).setOrigin(0.5);

    const startText = this.add.text(W / 2, H * 0.56, '[ CLICK or PRESS SPACE to START ]', {
      fontFamily: 'monospace', fontSize: '18px', color: '#00ff66'
    }).setOrigin(0.5);
    this.tweens.add({
      targets: startText, alpha: 0.3, duration: 700,
      yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
    });

    this.add.text(W / 2, H * 0.70, 'Arrow Keys / WASD: Move   |   SPACE: Bomb   |   ESC: Pause', {
      fontFamily: 'monospace', fontSize: '12px', color: '#336644'
    }).setOrigin(0.5);

    this.add.text(W / 2, H * 0.76, 'Auto-fire enabled  •  Collect power-ups to upgrade', {
      fontFamily: 'monospace', fontSize: '11px', color: '#335544'
    }).setOrigin(0.5);

    if (highScore > 0) {
      this.add.text(W / 2, H * 0.64, 'High Score: ' + highScore, {
        fontFamily: 'monospace', fontSize: '16px', color: '#ffcc00'
      }).setOrigin(0.5);
    }

    this.add.text(W / 2, H * 0.90, 'sloppy games', {
      fontFamily: 'monospace', fontSize: '12px', color: '#223322'
    }).setOrigin(0.5);

    this.input.once('pointerdown', () => this.startGame());
    this.input.keyboard.once('keydown-SPACE', () => this.startGame());
    this.input.keyboard.once('keydown-ENTER', () => this.startGame());

    gameState = 'intro';
  }

  startGame() {
    audioManager.play('confirm');
    this.scene.start('GameScene');
    gameState = 'playing';
  }

  update() {
    for (const s of this.starLayer1) {
      s.y += s.speed;
      if (s.y > H + 5) { s.y = -5; s.x = Phaser.Math.Between(0, W); }
    }
    for (const s of this.starLayer2) {
      s.y += s.speed;
      if (s.y > H + 5) { s.y = -5; s.x = Phaser.Math.Between(0, W); }
    }
  }
}

// ── GameScene ──
class GameScene extends Phaser.Scene {
  constructor() { super('GameScene'); }

  create() {
    this.cameras.main.setBackgroundColor('#050520');

    // Reset state
    score = 0; displayScore = 0; wave = 1; weaponLevel = 1; bombs = 1;
    hasShield = false; combo = 0; comboTimer = 0; maxCombo = 0;
    enemiesDestroyed = 0; survivalMs = 0;
    this.waveEnemiesAlive = 0;
    this.waveSpawned = false;
    this.waveComplete = false;
    this.waveDelay = 0;
    this.bossActive = false;
    this.bossRef = null;
    this.bossHpBar = null;
    this.bossHpFill = null;
    this.laserActive = false;
    this.invincible = false;
    this.invincibleTimer = 0;

    // Parallax stars
    this.starsA = [];
    this.starsB = [];
    for (let i = 0; i < 80; i++) {
      const s = this.add.image(Phaser.Math.Between(0, W), Phaser.Math.Between(0, H), 'star');
      s.setAlpha(Phaser.Math.FloatBetween(0.1, 0.3));
      s.setScale(Phaser.Math.FloatBetween(0.3, 0.5));
      s.speed = Phaser.Math.FloatBetween(0.3, 0.8);
      this.starsA.push(s);
    }
    for (let i = 0; i < 50; i++) {
      const s = this.add.image(Phaser.Math.Between(0, W), Phaser.Math.Between(0, H), 'star');
      s.setAlpha(Phaser.Math.FloatBetween(0.4, 0.8));
      s.setScale(Phaser.Math.FloatBetween(0.6, 1.2));
      s.speed = Phaser.Math.FloatBetween(1, 2);
      this.starsB.push(s);
    }

    // Player
    this.player = this.physics.add.sprite(W / 2, H - 80, 'player');
    this.player.setDepth(10);
    this.player.setCollideWorldBounds(true);
    this.player.body.setSize(18, 16);

    // Shield visual
    this.shieldSprite = this.add.image(this.player.x, this.player.y, 'shieldAura').setDepth(11).setVisible(false);
    this.tweens.add({
      targets: this.shieldSprite, scaleX: 1.15, scaleY: 1.15, alpha: 0.5,
      duration: 600, yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
    });

    // Trail
    this.trailEmitter = this.add.particles(0, 0, 'particleGreen', {
      follow: this.player,
      followOffset: { x: 0, y: 10 },
      speed: { min: 10, max: 30 },
      scale: { start: 0.5, end: 0 },
      alpha: { start: 0.4, end: 0 },
      lifespan: 300,
      frequency: 25,
      blendMode: 'ADD',
      quantity: 1
    });

    // Object pools
    this.playerBullets = this.physics.add.group({ maxSize: 60, classType: Phaser.Physics.Arcade.Sprite });
    this.enemyBullets = this.physics.add.group({ maxSize: 80, classType: Phaser.Physics.Arcade.Sprite });
    this.enemies = this.physics.add.group({ maxSize: 40, classType: Phaser.Physics.Arcade.Sprite });
    this.powerUps = this.physics.add.group({ maxSize: 10, classType: Phaser.Physics.Arcade.Sprite });

    // Laser beam (weapon level 3) — multiple overlapping rects for glow
    this.laserOuter = this.add.rectangle(0, 0, 12, H, 0x00ff66, 0.15).setDepth(8).setVisible(false).setBlendMode('ADD');
    this.laserMid = this.add.rectangle(0, 0, 6, H, 0x00ff66, 0.4).setDepth(9).setVisible(false).setBlendMode('ADD');
    this.laserCore = this.add.rectangle(0, 0, 2, H, 0xaaffcc, 0.8).setDepth(9).setVisible(false).setBlendMode('ADD');

    // Collisions
    this.physics.add.overlap(this.playerBullets, this.enemies, this.onBulletHitEnemy, null, this);
    this.physics.add.overlap(this.player, this.enemies, this.onPlayerHitEnemy, null, this);
    this.physics.add.overlap(this.player, this.enemyBullets, this.onPlayerHitBullet, null, this);
    this.physics.add.overlap(this.player, this.powerUps, this.onCollectPowerUp, null, this);

    // Auto-fire timer
    this.fireDelay = 200;
    this.fireTimer = this.time.addEvent({
      delay: this.fireDelay, callback: this.fireWeapon, callbackScope: this, loop: true
    });

    // Input
    this.cursors = this.input.keyboard.createCursorKeys();
    this.keyW = this.input.keyboard.addKey('W');
    this.keyA = this.input.keyboard.addKey('A');
    this.keyS = this.input.keyboard.addKey('S');
    this.keyD = this.input.keyboard.addKey('D');
    this.keySpace = this.input.keyboard.addKey('SPACE');
    this.keyEsc = this.input.keyboard.addKey('ESC');
    this.bombReady = true;

    // HUD
    this.scoreText = this.add.text(16, 12, 'SCORE 0', {
      fontFamily: 'monospace', fontSize: '18px', fontStyle: 'bold', color: '#00ff66'
    }).setScrollFactor(0).setDepth(20);
    this.scoreText.setShadow(2, 2, '#00ff66', 6, true, true);

    this.waveText = this.add.text(W / 2, 12, 'WAVE 1', {
      fontFamily: 'monospace', fontSize: '16px', fontStyle: 'bold', color: '#88ffaa'
    }).setOrigin(0.5, 0).setScrollFactor(0).setDepth(20);
    this.waveText.setShadow(1, 1, '#44aa66', 4, true, true);

    this.bombText = this.add.text(W - 16, 12, 'BOMB: 1', {
      fontFamily: 'monospace', fontSize: '14px', color: '#ff6644'
    }).setOrigin(1, 0).setScrollFactor(0).setDepth(20);

    this.weaponText = this.add.text(16, H - 24, 'WEAPON LV.1', {
      fontFamily: 'monospace', fontSize: '12px', color: '#00ccff'
    }).setScrollFactor(0).setDepth(20);

    this.comboText = this.add.text(W / 2, H * 0.4, '', {
      fontFamily: 'monospace', fontSize: '22px', fontStyle: 'bold', color: '#ffcc00'
    }).setOrigin(0.5).setScrollFactor(0).setDepth(20).setAlpha(0);
    this.comboText.setShadow(2, 2, '#886600', 6, true, true);

    this.waveAnnounce = this.add.text(W / 2, H * 0.3, '', {
      fontFamily: 'monospace', fontSize: '28px', fontStyle: 'bold', color: '#00ff66'
    }).setOrigin(0.5).setScrollFactor(0).setDepth(21).setAlpha(0);
    this.waveAnnounce.setShadow(2, 2, '#00aa44', 8, true, true);

    this.hiText = this.add.text(W - 16, H - 24, 'HI ' + highScore, {
      fontFamily: 'monospace', fontSize: '12px', color: '#334433'
    }).setOrigin(1, 1).setScrollFactor(0).setDepth(20);

    this.shieldText = this.add.text(W - 16, 30, '', {
      fontFamily: 'monospace', fontSize: '12px', color: '#4488ff'
    }).setOrigin(1, 0).setScrollFactor(0).setDepth(20);

    // Spawn first wave
    this.startWave(wave);

    gameState = 'playing';
  }

  startWave(waveNum) {
    this.waveData = generateWaveData(waveNum);
    this.waveSpawnIndex = 0;
    this.waveSpawnTimer = 0;
    this.waveEnemiesAlive = 0;
    this.waveSpawned = false;
    this.waveComplete = false;
    this.bossActive = false;
    this.bossRef = null;

    // Announce wave
    const isBoss = waveNum % 5 === 0;
    const label = isBoss ? 'BOSS WAVE ' + waveNum : 'WAVE ' + waveNum;
    this.waveAnnounce.setText(label);
    this.waveAnnounce.setColor(isBoss ? '#ff4444' : '#00ff66');
    this.waveAnnounce.setAlpha(1).setScale(0.5);
    this.tweens.add({
      targets: this.waveAnnounce,
      scaleX: 1, scaleY: 1, duration: 300, ease: 'Back.easeOut',
      onComplete: () => {
        this.tweens.add({
          targets: this.waveAnnounce,
          alpha: 0, y: H * 0.25, duration: 800, delay: 600, ease: 'Power2',
          onComplete: () => { this.waveAnnounce.y = H * 0.3; }
        });
      }
    });
    if (isBoss) audioManager.play('bossAlert');
    else audioManager.play('levelUp');
  }

  fireWeapon() {
    if (gameState !== 'playing') return;

    if (weaponLevel >= 3) {
      this.laserActive = true;
      const lx = this.player.x;
      const lh = this.player.y;
      const ly = lh / 2;
      this.laserOuter.setPosition(lx, ly).setSize(12, lh).setVisible(true);
      this.laserMid.setPosition(lx, ly).setSize(6, lh).setVisible(true);
      this.laserCore.setPosition(lx, ly).setSize(2, lh).setVisible(true);
      audioManager.play('laser');
      this.checkLaserHits();
      // Also fire spread bullets alongside laser
      this.spawnBullet(this.player.x - 10, this.player.y - 8, -60, -480);
      this.spawnBullet(this.player.x + 10, this.player.y - 8, 60, -480);
      return;
    }

    audioManager.play(weaponLevel >= 2 ? 'shootSpread' : 'shoot');

    // Single shot
    this.spawnBullet(this.player.x, this.player.y - 12, 0, -500);

    if (weaponLevel >= 2) {
      // Spread — 2 extra at angles
      this.spawnBullet(this.player.x - 8, this.player.y - 8, -80, -480);
      this.spawnBullet(this.player.x + 8, this.player.y - 8, 80, -480);
    }
  }

  spawnBullet(x, y, vx, vy) {
    let b = this.playerBullets.getFirstDead(false);
    if (!b) {
      b = this.playerBullets.create(x, y, 'bullet');
      b.body.setSize(4, 8);
    } else {
      b.enableBody(true, x, y, true, true);
    }
    b.setVelocity(vx, vy);
    b.setDepth(8);
    b.setBlendMode('ADD');
  }

  checkLaserHits() {
    const px = this.player.x;
    this.enemies.children.each(enemy => {
      if (!enemy.active) return;
      if (Math.abs(enemy.x - px) < 20) {
        this.damageEnemy(enemy, 8);
      }
    });
  }

  spawnEnemy(entry) {
    const texKey = entry.type === 'basic' ? 'enemyBasic' :
                   entry.type === 'shooter' ? 'enemyShooter' :
                   entry.type === 'miniboss' ? 'enemyMiniBoss' : 'boss';

    let e = this.enemies.getFirstDead(false);
    if (!e) {
      e = this.enemies.create(entry.x, -30, texKey);
    } else {
      e.enableBody(true, entry.x, -30, true, true);
      e.setTexture(texKey);
    }

    const hpMap = { basic: 8, shooter: 12, miniboss: 60, boss: 150 + wave * 15 };
    const scoreMap = { basic: 10, shooter: 25, miniboss: 100, boss: 500 };

    e.setDepth(6);
    e.setData('type', entry.type);
    e.setData('hp', hpMap[entry.type] || 10);
    e.setData('maxHp', hpMap[entry.type] || 10);
    e.setData('score', scoreMap[entry.type] || 10);
    e.setData('pattern', entry.pattern || 'straight');
    e.setData('spawnX', entry.x);
    e.setData('elapsed', 0);
    e.setData('shootTimer', 0);
    e.setData('phase', 1);

    const spd = entry.type === 'boss' ? 40 : entry.type === 'miniboss' ? 60 : 80 + wave * 5;
    e.setVelocityY(spd);
    e.setScale(1);

    if (entry.type === 'boss') {
      this.bossActive = true;
      this.bossRef = e;
      e.setScale(1.2);
      // Boss health bar
      if (this.bossHpBar) this.bossHpBar.destroy();
      if (this.bossHpFill) this.bossHpFill.destroy();
      this.bossHpBar = this.add.image(e.x, e.y - 28, 'hpBarBg').setDepth(22).setScale(4, 2);
      this.bossHpFill = this.add.image(e.x, e.y - 28, 'hpBarFill').setDepth(23).setScale(4, 2);
      this.bossHpFill.setTint(0xff2244);
    }

    this.waveEnemiesAlive++;
  }

  damageEnemy(enemy, dmg) {
    if (!enemy.active) return;
    let hp = enemy.getData('hp') - dmg;
    enemy.setData('hp', hp);

    // Flash white + hit spark
    enemy.setTintFill(0xffffff);
    this.time.delayedCall(50, () => { if (enemy.active) enemy.clearTint(); });
    const spark = this.add.particles(enemy.x, enemy.y, 'particleGold', {
      speed: { min: 30, max: 80 }, scale: { start: 0.4, end: 0 },
      lifespan: 150, blendMode: 'ADD', quantity: 3, emitting: false
    });
    spark.explode(3);
    this.time.delayedCall(200, () => spark.destroy());

    if (hp <= 0) {
      this.destroyEnemy(enemy);
    } else if (enemy.getData('type') === 'boss' && this.bossHpFill) {
      const pct = hp / enemy.getData('maxHp');
      this.bossHpFill.setScale(4 * pct, 2);
    }
  }

  destroyEnemy(enemy) {
    const type = enemy.getData('type');
    const pts = enemy.getData('score');

    // Combo tracking
    combo++;
    comboTimer = 1000;
    if (combo > maxCombo) maxCombo = combo;
    const comboMult = 1 + Math.floor(combo / 5) * 0.5;
    const earnedPts = Math.floor(pts * comboMult);
    score += earnedPts;
    enemiesDestroyed++;

    // Combo display
    if (combo >= 3) {
      this.comboText.setText(combo + 'x COMBO! +' + earnedPts);
      this.comboText.setAlpha(1).setScale(0.8);
      this.tweens.add({
        targets: this.comboText,
        scaleX: 1.1, scaleY: 1.1, duration: 150, yoyo: true,
        onComplete: () => {
          this.tweens.add({ targets: this.comboText, alpha: 0, duration: 500, delay: 300 });
        }
      });
    }

    // Explosion particles
    const particleKey = type === 'boss' ? 'particlePurple' :
                        type === 'shooter' ? 'particleOrange' : 'particleRed';
    const qty = type === 'boss' ? 40 : type === 'miniboss' ? 25 : 12;
    const burst = this.add.particles(enemy.x, enemy.y, particleKey, {
      speed: { min: 60, max: 200 },
      scale: { start: 1, end: 0 },
      alpha: { start: 1, end: 0 },
      lifespan: type === 'boss' ? 800 : 400,
      blendMode: 'ADD',
      quantity: qty,
      emitting: false
    });
    burst.explode(qty);
    this.time.delayedCall(type === 'boss' ? 900 : 500, () => burst.destroy());

    audioManager.play(type === 'boss' || type === 'miniboss' ? 'explosion' : 'hit');

    // Screen shake on bigger kills
    if (type === 'miniboss') {
      this.cameras.main.shake(300, 0.01);
    }

    if (type === 'boss') {
      this.cameras.main.shake(500, 0.02);
      this.cameras.main.flash(200, 170, 0, 255);
      this.bossActive = false;
      if (this.bossHpBar) { this.bossHpBar.destroy(); this.bossHpBar = null; }
      if (this.bossHpFill) { this.bossHpFill.destroy(); this.bossHpFill = null; }
    }

    // Drop power-up chance
    const dropChance = type === 'boss' ? 1.0 : type === 'miniboss' ? 0.6 : 0.08;
    if (Math.random() < dropChance) {
      this.spawnPowerUp(enemy.x, enemy.y);
    }

    enemy.disableBody(true, true);
    this.waveEnemiesAlive--;
  }

  spawnPowerUp(x, y) {
    const roll = Math.random();
    let type, texKey;
    if (roll < 0.4) { type = 'weapon'; texKey = 'puWeapon'; }
    else if (roll < 0.7) { type = 'shield'; texKey = 'puShield'; }
    else { type = 'bomb'; texKey = 'puBomb'; }

    let pu = this.powerUps.getFirstDead(false);
    if (!pu) {
      pu = this.powerUps.create(x, y, texKey);
    } else {
      pu.enableBody(true, x, y, true, true);
      pu.setTexture(texKey);
    }
    pu.setDepth(7);
    pu.setVelocityY(60);
    pu.setData('puType', type);

    // Golden aura tween
    this.tweens.add({
      targets: pu, scaleX: 1.3, scaleY: 1.3, duration: 400,
      yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
    });
  }

  onBulletHitEnemy(bullet, enemy) {
    bullet.disableBody(true, true);
    this.damageEnemy(enemy, weaponLevel >= 3 ? 6 : weaponLevel >= 2 ? 5 : 4);
  }

  onPlayerHitEnemy(player, enemy) {
    if (this.invincible) return;
    this.playerHit();
  }

  onPlayerHitBullet(player, bullet) {
    if (this.invincible) return;
    bullet.disableBody(true, true);
    this.playerHit();
  }

  playerHit() {
    if (hasShield) {
      hasShield = false;
      this.shieldSprite.setVisible(false);
      audioManager.play('shield');
      this.cameras.main.flash(100, 68, 136, 255);

      // Brief invincibility after shield break
      this.invincible = true;
      this.invincibleTimer = 1500;
      this.player.setAlpha(0.5);
      return;
    }

    // Death
    audioManager.play('hit');
    audioManager.play('gameOver');
    this.cameras.main.shake(400, 0.015);

    // Death flash
    const deathVeil = this.add.rectangle(W / 2, H / 2, W, H, 0xff2222, 0).setDepth(9999);
    this.tweens.add({
      targets: deathVeil, alpha: 0.4, duration: 150, yoyo: true, hold: 80,
      onComplete: () => deathVeil.destroy()
    });

    // Death particles
    const burst = this.add.particles(this.player.x, this.player.y, 'particleGreen', {
      speed: { min: 100, max: 300 },
      scale: { start: 1.2, end: 0 },
      alpha: { start: 1, end: 0 },
      lifespan: 700,
      blendMode: 'ADD',
      quantity: 30,
      emitting: false
    });
    burst.explode(30);
    this.time.delayedCall(800, () => burst.destroy());

    this.tweens.add({
      targets: this.player, scaleX: 0, scaleY: 0, alpha: 0,
      duration: 300, ease: 'Power2'
    });

    if (score > highScore) highScore = score;
    this.fireTimer.remove();
    this.physics.pause();
    if (this.trailEmitter) this.trailEmitter.stop();
    this.laserOuter.setVisible(false);
    this.laserMid.setVisible(false);
    this.laserCore.setVisible(false);

    gameState = 'gameover';

    this.time.delayedCall(700, () => {
      this.scene.start('GameOverScene');
    });
  }

  onCollectPowerUp(player, pu) {
    const type = pu.getData('puType');
    pu.disableBody(true, true);

    if (type === 'weapon') {
      weaponLevel = Math.min(weaponLevel + 1, 3);
      audioManager.play('powerUp');
      this.cameras.main.flash(100, 0, 200, 255);
      // Update fire rate based on weapon level
      this.fireTimer.remove();
      this.fireDelay = weaponLevel >= 3 ? 150 : weaponLevel >= 2 ? 170 : 200;
      this.fireTimer = this.time.addEvent({
        delay: this.fireDelay, callback: this.fireWeapon, callbackScope: this, loop: true
      });
      this.showPopText('WEAPON UP!', '#00ccff');
    } else if (type === 'shield') {
      hasShield = true;
      this.shieldSprite.setVisible(true);
      audioManager.play('shield');
      this.cameras.main.flash(100, 68, 136, 255);
      this.showPopText('SHIELD!', '#4488ff');
    } else if (type === 'bomb') {
      bombs++;
      audioManager.play('coin');
      this.showPopText('BOMB +1', '#ff6644');
    }

    // Collect particles
    const burst = this.add.particles(pu.x, pu.y, 'particleGold', {
      speed: { min: 40, max: 120 },
      scale: { start: 0.8, end: 0 },
      lifespan: 350,
      blendMode: 'ADD',
      quantity: 10,
      emitting: false
    });
    burst.explode(10);
    this.time.delayedCall(400, () => burst.destroy());
  }

  showPopText(msg, color) {
    const t = this.add.text(W / 2, H * 0.5, msg, {
      fontFamily: 'monospace', fontSize: '20px', fontStyle: 'bold', color: color
    }).setOrigin(0.5).setScrollFactor(0).setDepth(25).setScale(0.5);
    t.setShadow(2, 2, color, 8, true, true);
    this.tweens.add({
      targets: t, scaleX: 1.2, scaleY: 1.2, y: H * 0.45, duration: 300, ease: 'Back.easeOut',
      onComplete: () => {
        this.tweens.add({
          targets: t, alpha: 0, y: H * 0.40, duration: 500, delay: 300,
          onComplete: () => t.destroy()
        });
      }
    });
  }

  activateBomb() {
    if (bombs <= 0 || !this.bombReady || gameState !== 'playing') return;
    bombs--;
    this.bombReady = false;
    this.time.delayedCall(500, () => { this.bombReady = true; });

    audioManager.play('bomb');
    this.cameras.main.shake(300, 0.015);
    this.cameras.main.flash(200, 255, 255, 255);

    // Kill all enemies and bullets on screen
    this.enemies.children.each(e => {
      if (e.active) {
        this.destroyEnemy(e);
      }
    });
    this.enemyBullets.children.each(b => {
      if (b.active) b.disableBody(true, true);
    });

    // Screen-wide blast effect
    const blastRing = this.add.circle(this.player.x, this.player.y, 10, 0x00ff66, 0.4).setDepth(30);
    blastRing.setBlendMode('ADD');
    this.tweens.add({
      targets: blastRing,
      radius: 500, scaleX: 50, scaleY: 50, alpha: 0, duration: 500, ease: 'Power2',
      onComplete: () => blastRing.destroy()
    });
  }

  enemyShoot(enemy) {
    const type = enemy.getData('type');
    let bulletCount = 1;
    let pattern = 'aimed';

    if (type === 'miniboss') {
      bulletCount = 8;
      pattern = 'circular';
    } else if (type === 'boss') {
      const phase = enemy.getData('phase');
      if (phase === 1) { bulletCount = 12; pattern = 'circular'; }
      else { bulletCount = 4; pattern = 'aimed'; }
    }

    audioManager.play('enemyShoot');

    if (pattern === 'circular') {
      for (let i = 0; i < bulletCount; i++) {
        const angle = (Math.PI * 2 / bulletCount) * i;
        const spd = 120 + wave * 5;
        this.spawnEnemyBullet(enemy.x, enemy.y, Math.cos(angle) * spd, Math.sin(angle) * spd);
      }
    } else {
      // Aimed at player
      const dx = this.player.x - enemy.x;
      const dy = this.player.y - enemy.y;
      const len = Math.sqrt(dx * dx + dy * dy) || 1;
      const spd = 150 + wave * 5;
      for (let i = 0; i < bulletCount; i++) {
        const spread = (i - (bulletCount - 1) / 2) * 0.15;
        const ax = dx / len;
        const ay = dy / len;
        const rx = ax * Math.cos(spread) - ay * Math.sin(spread);
        const ry = ax * Math.sin(spread) + ay * Math.cos(spread);
        this.spawnEnemyBullet(enemy.x, enemy.y, rx * spd, ry * spd);
      }
    }
  }

  spawnEnemyBullet(x, y, vx, vy) {
    let b = this.enemyBullets.getFirstDead(false);
    if (!b) {
      b = this.enemyBullets.create(x, y, 'enemyBullet');
      b.body.setSize(5, 5);
    } else {
      b.enableBody(true, x, y, true, true);
    }
    b.setVelocity(vx, vy);
    b.setDepth(7);
    b.setBlendMode('ADD');
  }

  update(time, delta) {
    if (gameState !== 'playing') return;

    survivalMs += delta;
    this._scoreAccum = (this._scoreAccum || 0) + delta;
    while (this._scoreAccum >= 200) {
      score += 1;
      this._scoreAccum -= 200;
    }

    // Background color shifts with wave
    const bgColors = [0x050520, 0x080528, 0x0a0530, 0x0c0838, 0x100a40, 0x120c48];
    this.cameras.main.setBackgroundColor(bgColors[Math.min(Math.floor((wave - 1) / 2), bgColors.length - 1)]);

    // Combo decay
    if (comboTimer > 0) {
      comboTimer -= delta;
      if (comboTimer <= 0) { combo = 0; }
    }

    // Invincibility timer
    if (this.invincible) {
      this.invincibleTimer -= delta;
      this.player.setAlpha(Math.sin(time * 0.02) > 0 ? 0.8 : 0.3);
      if (this.invincibleTimer <= 0) {
        this.invincible = false;
        this.player.setAlpha(1);
      }
    }

    // Pause
    if (Phaser.Input.Keyboard.JustDown(this.keyEsc)) {
      this.scene.launch('PauseScene');
      this.scene.pause();
      gameState = 'paused';
      audioManager.onPause();
      return;
    }

    // Bomb
    if (Phaser.Input.Keyboard.JustDown(this.keySpace)) {
      this.activateBomb();
    }

    // Player movement (free movement in lower 60%)
    let vx = 0, vy = 0;
    if (this.cursors.left.isDown || this.keyA.isDown) vx = -PLAYER_SPEED;
    if (this.cursors.right.isDown || this.keyD.isDown) vx = PLAYER_SPEED;
    if (this.cursors.up.isDown || this.keyW.isDown) vy = -PLAYER_SPEED;
    if (this.cursors.down.isDown || this.keyS.isDown) vy = PLAYER_SPEED;
    this.player.setVelocity(vx, vy);

    // Constrain to bottom 60%
    if (this.player.y < MOVE_BOUNDS_Y) {
      this.player.y = MOVE_BOUNDS_Y;
      this.player.setVelocityY(0);
    }

    // Shield follows player
    this.shieldSprite.setPosition(this.player.x, this.player.y);

    // Laser follows player
    if (weaponLevel >= 3 && this.laserActive) {
      const lx = this.player.x;
      const lh = this.player.y;
      const ly = lh / 2;
      this.laserOuter.setPosition(lx, ly).setSize(12, lh);
      this.laserMid.setPosition(lx, ly).setSize(6, lh);
      this.laserCore.setPosition(lx, ly).setSize(2, lh);
    } else {
      this.laserOuter.setVisible(false);
      this.laserMid.setVisible(false);
      this.laserCore.setVisible(false);
      this.laserActive = false;
    }

    // Wave spawning
    if (!this.waveSpawned && this.waveData && this.waveSpawnIndex < this.waveData.length) {
      this.waveSpawnTimer += delta;
      while (this.waveSpawnIndex < this.waveData.length &&
             this.waveSpawnTimer >= this.waveData[this.waveSpawnIndex].delay) {
        this.spawnEnemy(this.waveData[this.waveSpawnIndex]);
        this.waveSpawnIndex++;
      }
      if (this.waveSpawnIndex >= this.waveData.length) {
        this.waveSpawned = true;
      }
    }

    // Check wave completion
    if (this.waveSpawned && this.waveEnemiesAlive <= 0 && !this.waveComplete) {
      this.waveComplete = true;
      this.waveDelay = 2000;
    }
    if (this.waveComplete) {
      this.waveDelay -= delta;
      if (this.waveDelay <= 0) {
        wave++;
        this.startWave(wave);
      }
    }

    // Enemy behavior
    this.enemies.children.each(enemy => {
      if (!enemy.active) return;
      const type = enemy.getData('type');
      const pattern = enemy.getData('pattern');
      let elapsed = enemy.getData('elapsed') + delta;
      enemy.setData('elapsed', elapsed);

      // Movement patterns
      if (pattern === 'sine') {
        const sx = enemy.getData('spawnX');
        enemy.x = sx + Math.sin(elapsed * 0.003) * 80;
      } else if (pattern === 'diagonal') {
        enemy.x += (elapsed < 2000 ? 1 : -1) * 0.5;
      }

      // Boss behavior
      if (type === 'boss') {
        if (enemy.y > 80) {
          enemy.setVelocityY(0);
          enemy.x = W / 2 + Math.sin(elapsed * 0.001) * 200;
        }
        const hp = enemy.getData('hp');
        const maxHp = enemy.getData('maxHp');
        if (hp < maxHp * 0.5) enemy.setData('phase', 2);

        // Track health bar to boss position
        if (this.bossHpBar) this.bossHpBar.setPosition(enemy.x, enemy.y - 28);
        if (this.bossHpFill) {
          const pct = hp / maxHp;
          this.bossHpFill.setPosition(enemy.x - (1 - pct) * 100, enemy.y - 28);
          this.bossHpFill.setScale(4 * pct, 2);
          if (pct < 0.3) this.bossHpFill.setTint(0xff0000);
          else if (pct < 0.6) this.bossHpFill.setTint(0xff8800);
        }

        let shootCd = enemy.getData('shootTimer') + delta;
        const shootInterval = enemy.getData('phase') === 1 ? 2000 : 1200;
        if (shootCd >= shootInterval) {
          shootCd = 0;
          this.enemyShoot(enemy);
        }
        enemy.setData('shootTimer', shootCd);
      }

      // Shooter behavior
      if (type === 'shooter') {
        let shootCd = enemy.getData('shootTimer') + delta;
        if (shootCd >= 2500 - wave * 80) {
          shootCd = 0;
          this.enemyShoot(enemy);
        }
        enemy.setData('shootTimer', shootCd);
      }

      // Mini-boss behavior
      if (type === 'miniboss') {
        if (enemy.y > 100) {
          enemy.setVelocityY(0);
          enemy.x = enemy.getData('spawnX') + Math.sin(elapsed * 0.002) * 120;
        }
        let shootCd = enemy.getData('shootTimer') + delta;
        if (shootCd >= 3000) {
          shootCd = 0;
          this.enemyShoot(enemy);
        }
        enemy.setData('shootTimer', shootCd);
      }

      // Remove if off screen (bottom)
      if (enemy.y > H + 50) {
        enemy.disableBody(true, true);
        this.waveEnemiesAlive--;
      }
    });

    // Clean up off-screen bullets
    this.playerBullets.children.each(b => {
      if (b.active && b.y < -20) b.disableBody(true, true);
    });
    this.enemyBullets.children.each(b => {
      if (b.active && (b.y > H + 20 || b.y < -20 || b.x < -20 || b.x > W + 20)) {
        b.disableBody(true, true);
      }
    });

    // Clean up off-screen power-ups
    this.powerUps.children.each(pu => {
      if (pu.active && pu.y > H + 30) pu.disableBody(true, true);
    });

    // Parallax stars
    for (const s of this.starsA) {
      s.y += s.speed;
      if (s.y > H + 5) { s.y = -5; s.x = Phaser.Math.Between(0, W); }
    }
    for (const s of this.starsB) {
      s.y += s.speed;
      if (s.y > H + 5) { s.y = -5; s.x = Phaser.Math.Between(0, W); }
    }

    this.renderHUD();
  }

  renderHUD() {
    displayScore += (score - displayScore) * 0.15;
    if (Math.abs(score - displayScore) < 1) displayScore = score;
    this.scoreText.setText('SCORE ' + Math.floor(displayScore));

    if (score >= 3000) {
      this.scoreText.setColor('#ffcc00');
      this.scoreText.setShadow(2, 2, '#886600', 8, true, true);
    } else if (score >= 1000) {
      this.scoreText.setColor('#00ffcc');
      this.scoreText.setShadow(2, 2, '#008866', 7, true, true);
    }

    this.waveText.setText('WAVE ' + wave);
    this.bombText.setText('BOMB: ' + bombs);
    this.bombText.setColor(bombs > 0 ? '#ff6644' : '#553322');
    const wNames = ['', 'SINGLE', 'SPREAD', 'LASER'];
    this.weaponText.setText('WEAPON LV.' + weaponLevel + ' ' + (wNames[weaponLevel] || ''));
    this.hiText.setText('HI ' + highScore);
    this.shieldText.setText(hasShield ? 'SHIELD ●' : '');
  }
}

// ── PauseScene ──
class PauseScene extends Phaser.Scene {
  constructor() { super('PauseScene'); }

  create() {
    this.add.rectangle(W / 2, H / 2, W, H, 0x020210, 0.8).setDepth(0);

    this.add.text(W / 2, H * 0.34, 'PAUSED', {
      fontFamily: 'monospace', fontSize: '48px', fontStyle: 'bold', color: '#00ff66'
    }).setOrigin(0.5).setDepth(1);

    this.add.text(W / 2, H * 0.48, 'Score: ' + score + '   Wave: ' + wave, {
      fontFamily: 'monospace', fontSize: '20px', color: '#88ffaa'
    }).setOrigin(0.5).setDepth(1);

    const resumeText = this.add.text(W / 2, H * 0.62, '[ Press ESC or CLICK to Resume ]', {
      fontFamily: 'monospace', fontSize: '16px', color: '#00ff66'
    }).setOrigin(0.5).setDepth(1);
    this.tweens.add({
      targets: resumeText, alpha: 0.3, duration: 800,
      yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
    });

    this.input.once('pointerdown', () => this.resumeGame());
    this.input.keyboard.once('keydown-ESC', () => this.resumeGame());
  }

  resumeGame() {
    audioManager.play('confirm');
    audioManager.onResume();
    gameState = 'playing';
    this.scene.stop();
    this.scene.resume('GameScene');
  }
}

// ── GameOverScene ──
class GameOverScene extends Phaser.Scene {
  constructor() { super('GameOverScene'); }

  create() {
    this.cameras.main.setBackgroundColor('#050520');
    this.add.rectangle(W / 2, H / 2, W, H, 0x020210, 0.9);

    // Stars
    for (let i = 0; i < 40; i++) {
      const s = this.add.image(Phaser.Math.Between(0, W), Phaser.Math.Between(0, H), 'star');
      s.setAlpha(Phaser.Math.FloatBetween(0.1, 0.4));
    }

    const goText = this.add.text(W / 2, H * 0.22, 'MISSION FAILED', {
      fontFamily: 'monospace', fontSize: '46px', fontStyle: 'bold', color: '#ff3366'
    }).setOrigin(0.5).setScale(0);
    goText.setShadow(3, 3, '#ff3366', 12, true, true);

    this.tweens.add({
      targets: goText, scaleX: 1, scaleY: 1, duration: 400, ease: 'Back.easeOut'
    });

    this.add.text(W / 2, H * 0.38, 'Score: ' + score, {
      fontFamily: 'monospace', fontSize: '28px', fontStyle: 'bold', color: '#00ff66'
    }).setOrigin(0.5);

    if (score >= highScore && highScore > 0) {
      const hsText = this.add.text(W / 2, H * 0.48, 'NEW HIGH SCORE!', {
        fontFamily: 'monospace', fontSize: '20px', fontStyle: 'bold', color: '#ffcc00'
      }).setOrigin(0.5);
      this.tweens.add({
        targets: hsText, alpha: 0.4, duration: 400,
        yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
      });
      const burst = this.add.particles(W / 2, H * 0.48, 'particleGold', {
        speed: { min: 20, max: 60 },
        scale: { start: 0.6, end: 0 },
        lifespan: 1500,
        blendMode: 'ADD',
        frequency: 120,
        quantity: 2,
        emitZone: { source: new Phaser.Geom.Rectangle(-120, -15, 240, 30), type: 'random' }
      });
    } else if (highScore > 0) {
      this.add.text(W / 2, H * 0.48, 'Best: ' + highScore, {
        fontFamily: 'monospace', fontSize: '15px', color: '#556677'
      }).setOrigin(0.5);
    }

    const survSec = Math.floor(survivalMs / 1000);
    const survMin = Math.floor(survSec / 60);
    const survRemSec = survSec % 60;
    const timeStr = survMin > 0 ? survMin + 'm ' + survRemSec + 's' : survSec + 's';

    const wNames = ['', 'Single', 'Spread', 'Laser'];
    this.add.text(W / 2, H * 0.58, [
      'Wave: ' + wave + '  |  Enemies: ' + enemiesDestroyed + '  |  Time: ' + timeStr,
      'Max Combo: ' + maxCombo + 'x  |  Weapon: ' + (wNames[weaponLevel] || 'Single')
    ].join('\n'), {
      fontFamily: 'monospace', fontSize: '12px', color: '#556677', align: 'center'
    }).setOrigin(0.5).setLineSpacing(4);

    const replayText = this.add.text(W / 2, H * 0.74, '[ CLICK or PRESS ENTER to PLAY AGAIN ]', {
      fontFamily: 'monospace', fontSize: '16px', color: '#00ff66'
    }).setOrigin(0.5);
    this.tweens.add({
      targets: replayText, alpha: 0.3, duration: 800,
      yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
    });

    this.add.text(W / 2, H * 0.88, 'sloppy games', {
      fontFamily: 'monospace', fontSize: '12px', color: '#223322'
    }).setOrigin(0.5);

    this.input.once('pointerdown', () => this.restartGame());
    this.input.keyboard.once('keydown-ENTER', () => this.restartGame());
    this.input.keyboard.once('keydown-SPACE', () => this.restartGame());
  }

  restartGame() {
    audioManager.play('confirm');
    gameState = 'playing';
    this.scene.start('GameScene');
  }
}

// ── SloppyGame Adapter (SDK v2 Contract) ──
window.SloppyGame = {
  metadata: {
    title: 'Plasma Blitz',
    genre: '2d-shooter',
    engine: 'phaser3',
    supportsMultiplayer: false,
    controls: [
      { key: 'Arrow Keys / WASD', action: 'Move ship' },
      { key: 'Space', action: 'Activate bomb' },
      { key: 'Escape', action: 'Pause' }
    ],
    estimatedPlayTime: '2-10 min'
  },
  supportsMultiplayer: false,

  async init(container, config) {
    try {
      phaserGame = new Phaser.Game({
        type: Phaser.AUTO,
        parent: container,
        width: config.width || W,
        height: config.height || H,
        backgroundColor: '#050520',
        physics: {
          default: 'arcade',
          arcade: { gravity: { x: 0, y: 0 }, debug: false }
        },
        scene: [BootScene, IntroScene, GameScene, PauseScene, GameOverScene],
        scale: {
          mode: Phaser.Scale.FIT,
          autoCenter: Phaser.Scale.CENTER_BOTH
        }
      });

      gameState = 'idle';

      await new Promise(resolve => {
        phaserGame.events.once('ready', resolve);
      });

      window.parent.postMessage({ type: 'sloppy:game:ready' }, '*');
    } catch (err) {
      window.parent.postMessage({
        type: 'sloppy:game:error',
        message: err.message,
        stack: err.stack
      }, '*');
      throw err;
    }
  },

  destroy() {
    audioManager.onDestroy();
    if (phaserGame) {
      phaserGame.destroy(true);
      phaserGame = null;
    }
    gameState = 'idle';
  },

  start() {
    if (phaserGame) {
      phaserGame.scene.start('IntroScene');
      gameState = 'intro';
    }
  },

  pause() {
    if (gameState !== 'playing' || !phaserGame) return;
    const gameScene = phaserGame.scene.getScene('GameScene');
    if (gameScene && gameScene.scene.isActive()) {
      gameScene.scene.launch('PauseScene');
      gameScene.scene.pause();
    }
    gameState = 'paused';
    audioManager.onPause();
  },

  resume() {
    if (gameState !== 'paused' || !phaserGame) return;
    const pauseScene = phaserGame.scene.getScene('PauseScene');
    if (pauseScene) pauseScene.scene.stop();
    const gameScene = phaserGame.scene.getScene('GameScene');
    if (gameScene) gameScene.scene.resume();
    gameState = 'playing';
    audioManager.onResume();
  },

  restart() {
    if (!phaserGame) return;
    phaserGame.scene.stop('PauseScene');
    phaserGame.scene.stop('GameOverScene');
    phaserGame.scene.stop('IntroScene');
    phaserGame.scene.start('GameScene');
    gameState = 'playing';
  },

  renderIntroScreen() {
    if (!phaserGame) return;
    phaserGame.scene.start('IntroScene');
    gameState = 'intro';
  },

  renderPauseScreen() {
    if (!phaserGame) return;
    const gameScene = phaserGame.scene.getScene('GameScene');
    if (gameScene && gameScene.scene.isActive()) {
      gameScene.scene.launch('PauseScene');
      gameScene.scene.pause();
    }
    gameState = 'paused';
  },

  renderGameOverScreen(scoreResult) {
    if (!phaserGame) return;
    if (scoreResult && typeof scoreResult.score === 'number') {
      score = scoreResult.score;
    }
    phaserGame.scene.start('GameOverScene');
    gameState = 'gameover';
  },

  renderHUD() {
    if (!phaserGame) return;
    const gameScene = phaserGame.scene.getScene('GameScene');
    if (gameScene && typeof gameScene.renderHUD === 'function') {
      gameScene.renderHUD();
    }
  },

  getState() {
    return gameState;
  },

  getScore() {
    return {
      score: score,
      level: wave,
      timeElapsed: Math.floor(survivalMs / 1000),
      customData: {
        wave: wave,
        weaponLevel: weaponLevel,
        combo: maxCombo,
        enemiesDestroyed: enemiesDestroyed,
        highScore: highScore
      }
    };
  }
};

window.game = window.SloppyGame;

window.triggerGameOver = function() {
  if (gameState === 'playing' && phaserGame) {
    if (score > highScore) highScore = score;
    gameState = 'gameover';
    phaserGame.scene.start('GameOverScene');
  }
};

// ── PostMessage command bridge ──
window.addEventListener('message', function(e) {
  if (!e.data || !e.data.type) return;
  var g = window.SloppyGame;
  switch (e.data.type) {
    case 'sloppy:command':
      var cmd = e.data.command;
      if (cmd === 'start' && g.start)     g.start();
      if (cmd === 'pause' && g.pause)     g.pause();
      if (cmd === 'resume' && g.resume)   g.resume();
      if (cmd === 'restart' && g.restart) g.restart();
      break;
    case 'sloppy:mute':
      if (typeof audioManager !== 'undefined') audioManager.mute();
      break;
    case 'sloppy:unmute':
      if (typeof audioManager !== 'undefined') audioManager.unmute();
      break;
  }
});

// ── Auto-init ──
(function boot() {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
    return;
  }
  window.SloppyGame.init(document.body, { container: document.body, width: W, height: H })
    .catch(function(err) {
      window.parent.postMessage({
        type: 'sloppy:game:error',
        message: err.message || 'init failed',
        stack: err.stack || ''
      }, '*');
    });
})();
</script>
